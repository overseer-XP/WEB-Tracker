<title>Valerie COE Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Calm palette: misty sage-grey ground, soft teal accent, pastel status fills. Layout: left rail, top bar with search and Simple / Full, work area, edit drawer */
:root{color-scheme:light;--shadow:0 1px 2px rgb(30 50 60/.07),0 4px 12px rgb(30 50 60/.07);
  --bg:#F3F6F5; --panel:#FFFFFF; --panel2:#EDF2F0; --ink:#2A3337; --muted:#59646A; --faint:#5E666A; --line:#E1E8E5; --line2:#D0D9D5;
  --rail:#EAF0ED; --railHover:#DEE7E3; --accent:#396C7D; --accentInk:#FFFFFF; --accentSoft:#DFECEF;
  --ok:#3A7454; --okBg:#E2F0E7; --warn:#856325; --warnBg:#F7EDD8; --bad:#9F4E48; --badBg:#F6E2DF;
  --info:#486887; --infoBg:#E3EBF3; --off:#59646A; --offBg:#ECF0EE;
  --fDone:#A9D0B6; --fProg:#CFC2E8; --fNot:#F4E2DF; --fNA:#E7ECEA;
  --dLive:#6EAD86; --dRisk:#D6A44C; --dTrack:#86ABCF;
  --g0:#8DB89B; --g1:#8FB0CF; --g2:#B5A4D5; --g3:#D6A98B; --g4:#93C1AF; --g5:#C7B88A;
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161B1D; --panel:#1E2427; --panel2:#252C30; --ink:#E1E7E8; --muted:#A2AEB2; --faint:#97A0A3; --line:#2E373B; --line2:#3A4448;
  --rail:#1A2023; --railHover:#253034; --accent:#86B9CA; --accentInk:#10181B; --accentSoft:#22353B;
  --ok:#8CC6A1; --okBg:#1E3227; --warn:#E0BF7E; --warnBg:#38301F; --bad:#E3A09A; --badBg:#3D2624;
  --info:#9DBAD8; --infoBg:#212F3B; --off:#ADB8BC; --offBg:#293033;
  --fDone:#3C6B50; --fProg:#64578A; --fNot:#48302E; --fNA:#2C3437;
  --dLive:#7BBE95; --dRisk:#D9AE5E; --dTrack:#8FB3D6;
  --g0:#5E8A6D; --g1:#5F80A0; --g2:#7F70A3; --g3:#A37B5F; --g4:#5F9483; --g5:#978A5F; color-scheme:dark; --shadow:0 1px 2px rgb(0 0 0/.45),0 3px 10px rgb(0 0 0/.25)}}
:root[data-theme="dark"]{
  --bg:#161B1D; --panel:#1E2427; --panel2:#252C30; --ink:#E1E7E8; --muted:#A2AEB2; --faint:#97A0A3; --line:#2E373B; --line2:#3A4448;
  --rail:#1A2023; --railHover:#253034; --accent:#86B9CA; --accentInk:#10181B; --accentSoft:#22353B;
  --ok:#8CC6A1; --okBg:#1E3227; --warn:#E0BF7E; --warnBg:#38301F; --bad:#E3A09A; --badBg:#3D2624;
  --info:#9DBAD8; --infoBg:#212F3B; --off:#ADB8BC; --offBg:#293033;
  --fDone:#3C6B50; --fProg:#64578A; --fNot:#48302E; --fNA:#2C3437;
  --dLive:#7BBE95; --dRisk:#D9AE5E; --dTrack:#8FB3D6;
  --g0:#5E8A6D; --g1:#5F80A0; --g2:#7F70A3; --g3:#A37B5F; --g4:#5F9483; --g5:#978A5F; color-scheme:dark; --shadow:0 1px 2px rgb(0 0 0/.45),0 3px 10px rgb(0 0 0/.25)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
a.bname,.hyg a{display:inline-block;min-height:24px;line-height:24px}
select,input:not([type=checkbox]):not([type=radio]):not([type=hidden]){min-height:24px}select.ps{min-height:24px}
input[type=checkbox],input[type=radio]{width:24px;height:24px;margin:0 4px 0 0;vertical-align:middle;accent-color:var(--accent)}
main h1[tabindex="-1"]:focus{outline:none}
.mtabs .mt{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--panel);color:var(--accent);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-weight:700;border:2px solid var(--accent)}.skip:focus{left:8px}
input,select,textarea{background-color:var(--panel);color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;overflow:hidden}
.app>*{min-height:0}
/* rail */
.rail{background:var(--rail);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px 24px;display:flex;flex-direction:column;gap:14px}
.mark{padding:0 8px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.mark small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.blink{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:6px;color:var(--ink);text-decoration:none}
.nav a:hover,.blink:hover{background:var(--railHover)}
.nav a.on,.blink.on{background:var(--accentSoft);color:var(--accent);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted)}
.rail h3{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:8px 9px 2px}
.blink{font-size:13px}
.blink .n{margin-left:auto;font-size:12px;color:var(--muted)}
.blink .tag{margin-left:4px}
.addbtn{border:1px dashed var(--line2);background:transparent;border-radius:6px;padding:6px;cursor:pointer;color:var(--muted)}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
/* health dot */
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--off);display:inline-block}
.dot.h-Live,.dot.h-OnTrack{background:var(--ok)}
.dot.h-AtRisk,.dot.h-Hasblockers,.dot.h-HasBlockers{background:var(--warn);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);width:11px;height:10px}
.dot.h-Blocked{background:var(--bad);border-radius:2px}
.dot.h-OnHold{background:transparent;box-shadow:inset 0 0 0 2px var(--faint)}
/* top */
.mainwrap{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 28px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.topbar .menu{display:none}
.topbar .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accentSoft);color:var(--accent);font-weight:600}
.nsdot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:1.5px solid var(--panel)}
.chdot{position:absolute;bottom:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--dRisk);border:1.5px solid var(--panel)}
.nsdot.inl,.chdot.inl{position:static;display:inline-block;border:0}
.acd{position:relative}
table.accfull td{vertical-align:middle}table.accfull tr.grp td{background:var(--panel2);font-size:13.5px;padding:7px 10px}
.seats{display:flex;flex-wrap:wrap;gap:4px}.seat{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--offBg);color:var(--off);white-space:nowrap}
.seat.st-Haslogin{background:var(--okBg);color:var(--ok)}.seat.st-Asked{background:var(--warnBg);color:var(--warn)}
.stepper{display:flex;flex-wrap:wrap;gap:4px;grid-column:1/-1}.sp{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--offBg);color:var(--muted)}.sp.past{background:var(--okBg);color:var(--ok)}.sp.cur{background:var(--accent);color:var(--accentInk);font-weight:600}
.seatedit,.thread{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}.seatrow{display:flex;align-items:center;gap:8px}.seatrow b{flex:1}
.thread textarea{width:100%;border:1px solid var(--line2);border-radius:6px;padding:8px;background:var(--panel)}
.sysn{font-size:12px;color:var(--muted);padding-left:10px;border-left:2px solid var(--line2)}
.box.wide{max-width:640px;width:100%}.box textarea{width:100%;border:1px solid var(--line2);border-radius:6px;padding:10px;background:var(--panel2);font:13px/1.5 var(--f-ui);margin-bottom:10px}
.bp-Locked{background:var(--panel);color:var(--bad);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 45%,transparent)}
.bp-Ready{box-shadow:inset 0 0 0 2px var(--dLive)}
.lockt,.readyt{display:block;font-size:12px;margin-top:2px}.lockt{color:var(--bad)}.readyt{color:var(--ok)}
#aform input,#aform select{border:1px solid var(--line2);border-radius:6px;padding:4px 6px;background:var(--panel)}#aform .card{margin-bottom:12px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 14px}
.toolbar .tl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.toolbar select{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 6px;color:var(--ink)}
.fold{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;width:24px;height:24px;padding:0}
.gl{font-size:15px}.flat{display:flex;flex-direction:column}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol.kbad{background:color-mix(in srgb,var(--badBg) 55%,var(--panel2))}
.kh{display:flex;align-items:center;gap:6px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:5px}
.kcard .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.kcard.blocked,.kcard.late{border-left:3px solid color-mix(in srgb,var(--bad) 60%,transparent)}.kcard.soon{border-left:3px solid var(--dRisk)}
.hint2{color:var(--muted);font-size:13px;margin:-6px 0 10px}
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.pcol{padding:12px 12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.pcol:last-child{border-right:0}.pcol.held{background:var(--panel2)}
.ph{display:flex;align-items:baseline;gap:7px;padding-bottom:8px;margin-bottom:4px;border-bottom:2px solid var(--accentSoft)}
.ph b{font-size:20px;font-weight:700;letter-spacing:-.02em}.ph span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);text-decoration:none;padding:2px 0;min-height:24px}
.pb:hover span{text-decoration:underline}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.who select{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 6px}
main{overflow-y:auto;padding:24px 28px 80px;flex:1;min-width:0;min-height:0}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px;font-weight:700;text-wrap:balance}
h2{font-size:16px;margin:26px 0 10px;font-weight:600}
.sub{color:var(--muted);margin:0 0 18px;max-width:72ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:600}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.missing{border:1px dashed var(--line2);background:transparent;color:var(--muted);border-radius:6px;padding:2px 8px;font-size:12.5px;cursor:pointer}
.missing:hover{color:var(--accent);border-color:var(--accent)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0 6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em}
.tile span{color:var(--muted);font-size:12.5px}
.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--warn)}
/* sow plan strip */
.plan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.week{padding:10px 12px;border-right:1px solid var(--line);min-width:0}
.week:last-child{border-right:0}
.week h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
.week h3 b{color:var(--ink)}
.week .chip{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0;color:var(--ink);text-decoration:none;flex-wrap:wrap}
.week .chip:hover span.nm{text-decoration:underline}
/* tables */
main.themed{background:linear-gradient(180deg,var(--btint) 0,color-mix(in srgb,var(--btint) 55%,var(--bg)) 300px,var(--bg) 700px);background-attachment:local}
main.themed .bhead h1{color:var(--bink);font-size:34px;letter-spacing:.01em}
main.themed .secs{background:color-mix(in srgb,color-mix(in srgb,var(--btint) 42%,var(--bg)) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
main.themed .facts{border-color:transparent}
:root[data-theme="dark"] main.themed{background:linear-gradient(180deg,color-mix(in srgb,var(--btint) 30%,var(--bg)) 0,var(--bg) 600px);background-attachment:local}:root[data-theme="dark"] main.themed .bhead h1{color:var(--ink)}
.tw,.tile,.card,.item,.team,.camp,.sec,.facts,.cbox,.deps,.gantt,.undated,.acclist,.bcard,.bpc,.next,.chipbtn,.btn:not(.pri){box-shadow:var(--shadow)}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
td.num,th.num{text-align:right}
td .hot{color:var(--bad);font-weight:600}
.bname{font-weight:600;color:var(--ink);text-decoration:none}
.bname:hover{text-decoration:underline}
.clip{max-width:420px;min-width:220px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.code{font-family:var(--f-code);font-size:12px;color:var(--muted)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:20px}
.s-ok{background:var(--okBg);color:var(--ok)}.s-warn{background:var(--warnBg);color:var(--warn)}.s-bad{background:var(--badBg);color:var(--bad)}
.s-info{background:var(--infoBg);color:var(--info)}.s-off{background:var(--offBg);color:var(--off)}
select.ps{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:1px 22px 1px 9px;font-size:12px;font-weight:600;cursor:pointer;line-height:20px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px;background-repeat:no-repeat}
select.ps:disabled{cursor:default;background-image:none;padding-right:9px}
.tag{font-size:12px;padding:0 6px;border-radius:999px;background:var(--offBg);color:var(--off);white-space:nowrap;line-height:18px;display:inline-block}
.tag.gate{background:var(--badBg);color:var(--bad);font-weight:600}
.tag.opt{background:transparent;border:1px dashed var(--line2)}
.tag.doc{background:var(--infoBg);color:var(--info)}
.tag.bad{background:var(--badBg);color:var(--bad);font-weight:600}
.tag.warn{background:var(--warnBg);color:var(--warn);font-weight:600}
.due{font-size:12.5px;white-space:nowrap}
.due.Overdue{color:var(--bad);font-weight:600}.due.DueSoon{color:var(--warn);font-weight:600}
/* team cards */
.secs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:14px 0 16px;padding:8px 0}
.bslim{position:sticky;top:-24px;z-index:6;margin:-24px -28px 16px;padding:10px 28px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bsl{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}.bsname{all:unset;cursor:pointer;font-size:19px;font-weight:700;color:var(--bink,var(--ink))}.bsname:hover{text-decoration:underline}:root[data-theme="dark"] .bsname{color:var(--ink)}.bsh{font-size:13px;font-weight:600}
.bslim .crumb{margin:0;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bslim .crumb b{font-weight:700}
.mtabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}.mt{all:unset;cursor:pointer;font-size:12px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);border-bottom:3px solid var(--line2);color:var(--muted);white-space:nowrap}.mt b{color:var(--ink);font-weight:700;margin-left:2px}
.mt:hover{background:var(--offBg)}.mt.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}.mt:focus-visible{outline:2px solid var(--accent)}
.cwarn{font-size:13px;font-weight:600}.cwarn.bad{color:var(--bad)}.cwarn.warn{color:var(--warn)}.cwarn.ok{color:var(--ok)}
.bblock{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px;box-shadow:var(--shadow);font-size:13px}
.bbk{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:3px 8px;border-radius:7px;background:var(--offBg)}.bbk:hover{background:var(--line)}.bbk:focus-visible{outline:2px solid var(--accent)}
.sec{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line2);border-radius:10px;padding:9px 12px 10px;display:flex;flex-direction:column;gap:1px;min-width:0;transition:box-shadow .15s,border-color .15s}
.sec .sl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec .sv{font-size:20px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec .ss{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec:hover{box-shadow:0 3px 12px rgb(0 0 0/.07);border-color:var(--line2)}
.sec-bad{border-left-color:var(--bad)}.sec-bad .ss{color:var(--bad);font-weight:600}.sec-warn{border-left-color:var(--warn)}.sec-warn .ss{color:var(--warn);font-weight:600}.sec-ok{border-left-color:var(--ok)}.sec-info{border-left-color:var(--info)}
.sec.on{background:var(--accentSoft);border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}.sec.on .sl{color:var(--accent)}
.sec:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nextl{margin:10px 0 0;font-size:13.5px;display:flex;gap:8px;align-items:baseline}.nextl b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}

.pnode.on{background:var(--accentSoft)}.pnode:hover{background:var(--offBg)}.pnode.on:hover{background:var(--accentSoft)}.pnode:focus-visible{outline:2px solid var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}

.cmain{display:flex;flex-direction:column;min-width:0}.cmain b{font-size:16px}.cmain .faint{font-size:13px}
.cwhen{font-size:13px;white-space:nowrap}.cprog{display:flex;align-items:center;gap:8px}.cprog>span{display:flex;flex-direction:column;font-size:13px;line-height:1.2}.chev{font-size:22px;color:var(--muted)}

  .jbar{flex-direction:column}.jseg{flex:none!important}
  .ptrack{flex-direction:column;overflow:visible}.pnode{flex-direction:row;text-align:left;min-width:0;gap:10px;min-height:48px}.pnode::before{top:-50%;bottom:50%;left:21px;right:auto;width:3px;height:auto}.pcount{margin-left:auto}
  .crow{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}.crow .cmain{grid-column:1/-1;order:-1}.crow .chev{display:none}
  .rmap{--nw:100px;--mw:0px}.rmtl,.mL{display:none}.mS{display:inline}.rmh,.rmr{gap:8px}.rmeta{display:none}.rmkey{gap:8px 12px}.road{grid-template-columns:1fr;gap:12px}
  .memx{width:44px;height:44px}.rmr,.jseg,.intro .missing{min-height:46px}}

<div class="app">
  <button class="skip" data-act="skip">Skip to content</button>
  <aside class="rail" id="rail" aria-label="Navigation"></aside>
  <div class="mainwrap">
    <div class="topbar" id="topbar"></div>
    <main id="main"><h1>Valerie COE Tracker</h1><p class="sub">Loading brands, tasks and steps.</p></main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Edit"></aside>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
/* ---------- state ---------- */
const COLL={esc:"escalations",camps:"campaigns",brands:"brands",tasks:"tasks",access:"access",sow:"sow",bps:"bps",steps:"steps",bsteps:"brand_steps",config:"config",comments:"comments",snaps:"snapshots"};
const S={esc:{},camps:{},brands:{},tasks:{},access:{},sow:{},bps:{},steps:{},bsteps:{},config:{},comments:{},snaps:{},log:{}};
const ready={};
let db=null,U=null,uid=null,canEdit=false,canWrite=true,dl=null;
let me="";               // the person this viewer picked
let simple=null;          // null until we know the role
let route={v:"",id:""};let campSel={bid:"",id:""};
let brandTab="home",drawerCtx=null;
const flt={accBrand:"",accStatus:"",taskStatus:"open",accGap:false};
let accBrand="",sowView="board";
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// Light by default, whatever the device is set to. Each person can switch to dark.
let theme=ls.get("vt-theme")==="dark"?"dark":"light";
const applyTheme=()=>{document.documentElement.setAttribute("data-theme",theme)};applyTheme();
new MutationObserver(()=>{if(document.documentElement.getAttribute("data-theme")!==theme)applyTheme()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
try{const sv=ls.get("vt-simple");if(sv!==null)simple=sv==="1";me=ls.get("vt-me")||"";accBrand=ls.get("vt-accbrand")||"";sowView=ls.get("vt-sowview")||"board"}catch(e){}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=s=>String(s||"").replace(/[^A-Za-z]/g,"");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2400)}
const L=n=>(S.config.lists&&S.config.lists[n])||[];
const people=()=>((S.config.people&&S.config.people.people)||[]);
const activePeople=()=>people().filter(p=>p.active!==false).map(p=>p.name).sort((a,b)=>a.localeCompare(b));
function namesFor(person){const p=people().find(x=>x.name===person);return [person].concat(p&&p.aliases||[]).filter(Boolean).map(s=>s.toLowerCase())}
function isPerson(val,person){if(!val||!person)return false;const ns=namesFor(person);return ns.includes(String(val).toLowerCase().trim())}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function isoToday(){const d=today();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseD(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
const dayDiff=s=>{const d=parseD(s);return d?Math.round((d-today())/864e5):null};
function fmtD(s,long){const d=parseD(s);if(!d)return"";return d.toLocaleDateString("en-GB",long?{weekday:"short",day:"numeric",month:"short"}:{day:"numeric",month:"short"})}
/* Excel rule: blank if done or no date; Overdue if before today; Due Soon if within 3 days; else On Time */
function dueFlag(date,done){if(done)return"";const n=dayDiff(date);if(n===null)return"";if(n<0)return"Overdue";if(n<=3)return"Due Soon";return"On Time"}
function dueText(date,flag){const n=dayDiff(date);if(n===null)return"";if(flag==="Overdue")return"Late by "+(-n)+(n===-1?" day":" days");if(n===0)return"Due today";if(n===1)return"Due tomorrow";return"Due "+fmtD(date,true)}
function dueHtml(date,done){const f=dueFlag(date,done);if(!f)return date&&done?`<span class="due faint">${esc(fmtD(date))}</span>`:"";return`<span class="due ${key(f)}">${esc(dueText(date,f))}</span>`}
function cls(v){
  // Five meanings only: green finished or healthy, blue moving, amber needs a look, red stopped, grey not started or parked.
  if(["Complete","Granted","Team confirmed","Signed","Done","Live","All Granted","On Time","On Track"].includes(v))return"s-ok";
  if(["Blocked","Overdue","Urgent"].includes(v))return"s-bad";
  if(["At Risk","Has blockers","Due Soon","High","Asked founder","Founder actioned"].includes(v))return"s-warn";
  if(["In Progress","Briefed","Requested","Drafting","Internal Review","Final Review (Ben)","Founder Check-in","Revisions","Sent for Signature","Foundations","Tactics In","In QA","Template Pending"].includes(v))return"s-info";
  return"s-off";
}
const pill=v=>v?`<span class="pill ${cls(v)}">${v==="Blocked"?"! ":""}${esc(v)}</span>`:"";
const hdot=h=>`<span class="dot h-${key(h)}" aria-hidden="true"></span>`;
const brandList=()=>Object.entries(S.brands).map(([id,b])=>Object.assign({id},b)).sort((a,b)=>(a.order||999)-(b.order||999)||String(a.name).localeCompare(b.name));
const bname=id=>(S.brands[id]&&S.brands[id].name)||"";
const isInternal=b=>(b&&b.stage)==="Internal";
/* on hold = brand stage On Hold or the Paused flag. Every screen uses this one test. */
const onHold=b=>!!b&&(b.stage==="On Hold"||!!b.paused);
const holdOf=bid=>onHold(S.brands[bid]);
const stepBlocks=bid=>Object.values((S.bsteps[bid]&&S.bsteps[bid].s)||{}).filter(x=>x&&x.blocker&&x.blocker.text&&!["Done","N/A"].includes(x.status)).length;
const stepsSorted=()=>Object.entries(S.steps).map(([id,s])=>Object.assign({id},s)).sort((a,b)=>a.order-b.order);
function phases(){const out=[];for(const s of stepsSorted()){let p=out.find(x=>x.code===s.phase);if(!p){p={code:s.phase,name:s.phase_name,steps:[]};out.push(p)}p.steps.push(s)}return out}
const stepState=(bid,code)=>((S.bsteps[bid]&&S.bsteps[bid].s)||{})[code]||{};
const withId=o=>Object.entries(o).map(([k,v])=>Object.assign({_id:k},v));
const opts=(arr,cur,blank)=>{const list=arr.slice();if(cur&&!list.includes(cur))list.push(cur);return(blank!==false?`<option value=""></option>`:"")+list.map(o=>`<option value="${esc(o)}" ${o===cur?"selected":""}>${esc(o)}</option>`).join("")};

/* ---------- roll-ups (from the Excel formulas) ---------- */
function bpRoll(bid){const d=S.bps[bid];if(!d)return null;const secs=L("bp_section");const vals=secs.map(x=>(d.sections||{})[x]||"Not Started");
  const live=vals.filter(v=>v!=="N/A");const done=live.filter(v=>v==="Complete").length;const progress=live.length?done/live.length:0;
  let overall="In Progress";
  if(vals.includes("Blocked"))overall="Blocked";else if(done===live.length)overall="Complete";else if(vals.every(v=>v==="Not Started"||!v))overall="Not Started";else if(vals.includes("In QA"))overall="In QA";
  return{overall,progress,done,total:live.length,due:dueFlag(d.due_date,progress===1)}}
function accessRoll(bid){const rows=Object.values(S.access).filter(a=>a.brand===bid&&a.status!=="Not Needed");const g=rows.filter(accGranted).length;
  let s="Not Set Up";if(rows.length)s=rows.some(a=>a.status==="Blocked")?"Blocked":g===rows.length?"All Granted":"In Progress";return{summary:s,text:rows.length?g+" / "+rows.length:""}}
const sowDue=s=>!s||s.stage==="Signed"?"":dueFlag(s.target_sign||s.draft_due,false);
/* Road to SOW: the one progress number for a brand, used on every screen and in the export.
   Required steps only (optional steps never hold a brand back); Done or N/A counts as done, so 100% means every phase is done. */
function journeyCount(bid){let total=0,done=0;for(const s of stepsSorted()){if(s.is_optional)continue;total++;if(["Done","N/A"].includes(stepState(bid,s.code).status))done++}return{done,total}}
function onboarding(bid){const c=journeyCount(bid);return c.total?c.done/c.total:0}
function roll(bid){return memo("roll:"+bid,()=>rollNow(bid))}
function tasksOf(bid){return memo("tasksBy",()=>{const m={};for(const t of Object.values(S.tasks))if(t.title)(m[t.brand]=m[t.brand]||[]).push(t);return m})[bid]||[]}
function rollNow(bid){
  const b=S.brands[bid]||{};
  const ts=tasksOf(bid);
  const open=ts.filter(t=>t.status!=="Complete").length;
  const blocked=ts.filter(t=>t.status==="Blocked").length;
  const overdue=ts.filter(t=>dueFlag(t.deadline,t.status==="Complete")==="Overdue").length;
  const acc=accessRoll(bid);const s=S.sow[bid];const sow=isInternal(b)?"N/A":(s?(s.stage||"Not Started"):"Not Set");
  const bp=bpRoll(bid);const pct=onboarding(bid);
  const why=[];let whyTab="";const reason=(t,tab)=>{why.push(t);if(!whyTab)whyTab=tab};
  if(sow==="Blocked")reason("SOW blocked"+(s&&s.blocker?": "+s.blocker:""),"sow");
  if(acc.summary==="Blocked")reason("Platform access blocked","access");
  if(bp&&bp.overall==="Blocked")reason("Best Practices blocked","bp");
  for(const st of stepsSorted())if(st.is_gate){const x=stepState(bid,st.code);if(x.blocker&&x.blocker.text&&!["Done","N/A"].includes(x.status))reason("Gate step blocked: "+st.name,"steps")}
  for(const t of ts)if(t.status==="Blocked"&&["High","Urgent"].includes(t.priority))reason(t.title+(t.blocker&&t.blocker.text?": "+t.blocker.text:""),"tasks");
  let health="On Track";
  if(onHold(b))health="On Hold";
  else if(why.length)health="Blocked";
  else if(overdue>0)health="At Risk";else if(blocked>0)health="Has blockers";else if(sow==="Signed")health="Live";
  return{open,blocked,overdue,acc,sow,sowRow:s||{},bp,pct,health,why,whyTab,hold:onHold(b),stepBlocked:stepBlocks(bid)}}

/* ---------- writes + change log ---------- */
const wq={};
function chain(k,fn){wq[k]=(wq[k]||Promise.resolve()).then(fn,fn);return wq[k]}
function refused(e){if(e&&e.code==="invalid_argument"){canWrite=false;toast("You can view this tracker but not change it.");render();return true}return false}
async function save(c,id,patch,label){
  if(!db||!canWrite){toast("You can view this tracker but not change it.");return}
  const cur=S[c][id];if(c==="brands"&&patch.stage&&cur&&patch.stage!==cur.stage)patch=Object.assign({},patch,{stage_since:isoToday()});
  const old={};for(const k of Object.keys(patch))old[k]=cur?cur[k]:undefined;
  S[c][id]=Object.assign({},cur||{},patch);render();
  const body=Object.assign({},patch,{updated_at:Date.now(),updated_by:uid||""});
  return chain(c+"/"+id,()=>(cur?db.doc(COLL[c]+"/"+id).update(body):db.doc(COLL[c]+"/"+id).set(Object.assign({},S[c][id],body))))
    .then(()=>{toast("Saved");addLog(c,id,patch,old,label)})
    .catch(e=>{if(!refused(e))toast("Not saved. Check your connection and try again.");if(cur)S[c][id]=cur;render()});
}
async function create(c,id,body,label){
  if(!db||!canWrite){toast("You can view this tracker but not change it.");return null}
  const ref=id?db.doc(COLL[c]+"/"+id):db.collection(COLL[c]).doc();
  const full=Object.assign({},body,{created_at:Date.now(),updated_at:Date.now(),updated_by:uid||""});
  S[c][ref.id]=full;render();
  try{await ref.set(full);addLog(c,ref.id,{created:label||"new"},{}, label);toast("Added");return ref.id}
  catch(e){delete S[c][ref.id];render();if(!refused(e))toast(e&&e.code==="quota_exceeded"?"The tracker is full. Ask an admin to archive old rows.":"Not added. Try again.");return null}
}
async function remove(c,id,label){
  if(!db||!canWrite)return;const cur=S[c][id];delete S[c][id];render();
  try{await db.doc(COLL[c]+"/"+id).delete();addLog(c,id,{deleted:true},{},label);toast("Deleted")}catch(e){S[c][id]=cur;render();if(!refused(e))toast("Not deleted. Try again.")}
}
let logBuf=null;
function addLog(c,id,patch,old,label){
  const day=isoToday();const lid=day+"_"+(uid||"anon");
  const entries=[];for(const k of Object.keys(patch)){if(k==="updated_at"||k==="updated_by")continue;
    const f=v=>v==null?"":typeof v==="object"?JSON.stringify(v).slice(0,140):String(v).slice(0,140);
    entries.push({at:Date.now(),what:COLL[c]||c,id,label:label||"",field:k,old:f(old[k]),new:f(patch[k])})}
  if(!entries.length)return;
  chain("log/"+lid,async()=>{const base=(S.log[lid]&&S.log[lid].entries)||[];const all=base.concat(entries).slice(-400);
    const body={date:day,who:uid||"",person:me||"",entries:all};S.log[lid]=body;try{await db.doc("log/"+lid).set(body)}catch(e){}});
}

/* ---------- routing ---------- */
function parseHash(){const h=location.hash.replace(/^#/,"");
  if(h.startsWith("brand-")){const[head,cid]=h.slice(6).split("/c/");const[bid,tab]=head.split("/");route={v:"brand",id:bid,camp:cid?decodeURIComponent(cid):""};campSel={bid,id:route.camp};brandTab=route.camp?"tasks":tab==="steps"?"sow":(tab||"home")}
  else if(h.startsWith("client-"))route={v:"client",id:h.slice(7)};
  else if(["mine","overview","access","sow","bp","settings","people"].includes(h))route={v:h,id:""};
  else route={v:"",id:""};
  $("#rail").classList.remove("open");closeDrawer();render();$("#main").scrollTop=0}
window.addEventListener("hashchange",()=>{parseHash();const h=$("#main h1");if(h&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#drawer,#modal"))){h.tabIndex=-1;h.focus({preventScroll:true})}});
const go=h=>{if(location.hash==="#"+h)parseHash();else location.hash=h};
const campHash=(bid,cid)=>"brand-"+bid+(cid?"/c/"+encodeURIComponent(cid):"/tasks");

/* ---------- render ---------- */
let pend=false;
function editing(){const a=document.activeElement;return a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT"&&!/checkbox|radio|button|submit/.test(a.type))&&($("#main").contains(a)||$("#drawer").contains(a))}
// Numbers per brand are worked out once per draw and reused by every part of the page.
let epoch=0;const memoStore=new Map();function memo(k,fn){const e=memoStore.get(k);if(e&&e.ep===epoch)return e.v;const v=fn();memoStore.set(k,{ep:epoch,v});return v}
let rq=0;function scheduleRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
function render(){epoch++;if(pop&&!document.activeElement?.closest?.("#pop"))closePop();if(editing()){pend=true;return}pend=false;renderRail();renderTop();renderMain();if(drawerCtx&&!$("#drawer").hidden)openDrawer(drawerCtx.kind,drawerCtx.id,drawerCtx.extra,true)}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pend&&!editing())render()},0));

const STAGE_ORDER=()=>{const st=L("stage");const main=st.filter(s=>!["On Hold","Internal"].includes(s)).reverse();return main.concat(st.filter(s=>["On Hold","Internal"].includes(s)))};
function myItems(){return memo("mine:"+me,myItemsNow)}
function myItemsNow(){
  if(!me)return[];const out=[];
  for(const t of withId(S.tasks)){if(!t.title||t.status==="Complete")continue;const own=isPerson(t.owner,me),sup=(t.support||[]).some(x=>isPerson(x,me));if(!own&&!sup)continue;
    const f=dueFlag(t.deadline,false);out.push({kind:"task",id:t._id,brand:t.brand,title:t.title,status:t.status,due:t.deadline,flag:f,blocked:t.status==="Blocked",blocker:t.blocker,priority:t.priority,role:own?"Owner":"Support",notes:t.notes})}
  for(const a of withId(S.access)){const ns=a.next_step;if(!ns||!ns.text||!isPerson(ns.who,me)||!accOpen(a))continue;const f=dueFlag(ns.due,false);
    out.push({kind:"access",id:a._id,brand:a.brand,title:a.platform+": "+ns.text,status:a.status||"Needed",due:ns.due,flag:f,blocked:a.status==="Blocked",blocker:a.blocker?{text:a.blocker}:null,role:"Access next step"})}
  for(const[bid,d]of Object.entries(S.bsteps)){for(const[code,st]of Object.entries(d.s||{})){if(!isPerson(st.owner,me)||st.status==="Done"||st.status==="N/A")continue;const s=S.steps[code];if(!s)continue;
    const f=dueFlag(st.deadline,false);out.push({kind:"step",id:bid,code,brand:bid,title:s.name,status:st.status||"Not Started",due:st.deadline,flag:f,blocked:!!(st.blocker&&st.blocker.text),blocker:st.blocker,role:"Step owner"})}}
  return out}
function renderRail(){
  const mine=myItems().length;
  const nav=[["mine","My tasks",mine||""],["overview","Overview",""],["people","People",""],["sow","SOW tracker",""],["access","Platform access",""],["bp","Best Practices",""]];
  if(isLeader(me))nav.splice(1,0,["leadership","Leadership",leaderCount()||""]);
  if(canEdit)nav.push(["settings","Settings",""]);
  let h=`<div class="mark">Valerie COE<small>Brand onboarding tracker</small></div><nav class="nav">`;
  for(const[k,l,n]of nav)h+=`<a href="#${k}" class="${route.v===k?"on":""}">${esc(l)}<span class="n">${n}</span></a>`;
  h+=`</nav><div>`;
  const groups={};for(const b of brandList())(groups[b.stage||"Qualification"]=groups[b.stage||"Qualification"]||[]).push(b);
  for(const st of STAGE_ORDER()){if(!groups[st])continue;h+=`<h3>${esc(st)}</h3>`;
    for(const b of groups[st]){const r=roll(b.id);

/* ---------- freshness, stage age ---------- */
const DAY=864e5;
function lastUpdated(bid){return memo("lu",()=>{const idx={};const take=(b,d)=>{if(!d||!b)return;const v=+d.updated_at||+d.created_at||0;if(v>(idx[b]||0))idx[b]=v};
  for(const[id,d]of Object.entries(S.brands))take(id,d);for(const[id,d]of Object.entries(S.sow))take(id,d);for(const[id,d]of Object.entries(S.bps))take(id,d);for(const[id,d]of Object.entries(S.bsteps))take(id,d);
  for(const t of Object.values(S.tasks))take(t.brand,t);for(const a of Object.values(S.access))take(a.brand,a);for(const c of Object.values(S.comments))take(c.brand,c);return idx})[bid]||0}
function lastUpdatedSlow(bid){let m=0;const take=d=>{if(!d)return;const v=+d.updated_at||+d.created_at||0;if(v>m)m=v};
  take(S.brands[bid]);take(S.sow[bid]);take(S.bps[bid]);take(S.bsteps[bid]);
  for(const t of Object.values(S.tasks))if(t.brand===bid)take(t);for(const a of Object.values(S.access))if(a.brand===bid)take(a);
  for(const c of Object.values(S.comments))if(c.brand===bid)take(c);return m}
function agoText(ts){if(!ts)return"";const d=Math.floor((Date.now()-ts)/DAY);return d<=0?"today":d===1?"yesterday":d+" days ago"}
function stageDays(b){const d=parseD(b&&b.stage_since);return d?Math.max(0,Math.round((today()-d)/DAY)):null}

/* ---------- needs attention: the exceptions leadership should act on ---------- */
function attention(bs,R){const out=[];
  for(const b of bs){if(isInternal(b)||onHold(b))continue;const r=R[b.id];const s=S.sow[b.id]||{};const add=(kind,text,tab)=>out.push({b,kind,text,tab});
    if(r.health==="Blocked")add("Blocked",r.why[0]||"Blocked",r.whyTab||"tasks");
    if(s.target_sign&&s.stage!=="Signed"&&dayDiff(s.target_sign)<0)add("Past SOW target",`Target ${fmtD(s.target_sign,true)}, SOW ${s.stage||"Not Started"}`,"sow");
    if(b.stage==="Live"&&s.stage&&s.stage!=="Signed")add("Stage mismatch",`Brand is Live but the SOW is ${s.stage}`,"sow");
    if(s.stage==="Signed"&&b.stage!=="Live")add("Stage mismatch",`SOW is Signed but the brand is at ${b.stage}`,"sow");
    const ch=withId(S.access).filter(a=>a.brand===b.id&&needsChase(a));if(ch.length)add("Chase founder",`${ch.map(a=>a.platform).join(", ")}: asked ${chaseDays()}+ working days ago`,"access");
    const lu=lastUpdated(b.id);if(lu&&Date.now()-lu>7*DAY)add("No update",`Nothing changed for ${Math.floor((Date.now()-lu)/DAY)} days`,"updates")}
  const order={"Blocked":0,"Past SOW target":1,"Chase founder":2,"Stage mismatch":3,"No update":4};
  return out.sort((x,y)=>order[x.kind]-order[y.kind])}
function hygiene(){const open=withId(S.tasks).filter(t=>t.title&&t.status!=="Complete"&&!holdOf(t.brand));
  return[["High or Urgent tasks with no deadline",open.filter(t=>["High","Urgent"].includes(t.priority)&&!t.deadline).length,"people"],
    ["Open tasks with no owner",open.filter(t=>!t.owner).length,"people"],
    ["Brands with no brand lead",brandList().filter(b=>!isInternal(b)&&!b.lead).length,"overview"],
    ["SOWs with no owner",Object.entries(S.sow).filter(([id,s])=>S.brands[id]&&!onHold(S.brands[id])&&!s.owner).length,"sow"]].filter(x=>x[1])}

/* ---------- daily snapshot for trends ---------- */
function portfolioNumbers(bs,R){const active=bs.filter(b=>!onHold(b)&&!isInternal(b));
  const ws=weekStart(today()),we=new Date(ws);we.setDate(we.getDate()+7);

function campTimeline(c,ts){

  const ticks=[];const first=new Date(lo);first.setDate(first.getDate()+((8-first.getDay())%7));for(let d=+first;d<hi;d+=step*DAY)ticks.push(d);

/* ---------- SOW progress board. Groups and columns come from config/sow_board ---------- */
function boardCols(){const cfg=S.config.sow_board;
  if(cfg&&Array.isArray(cfg.groups)&&cfg.groups.length)return cfg.groups;
  return phases().map(p=>({name:p.code+" "+p.name,cols:p.steps.map(s=>({label:s.name,steps:[s.code]}))}))}
function boardCell(bid,col){
  if(col.sow_stage){const st=(S.sow[bid]||{}).stage||"";if((col.sow_stage.done||[]).includes(st))return"Done";if((col.sow_stage.progress||[]).includes(st))return"In progress";return"Not done"}
  const vals=(col.steps||[]).filter(c=>S.steps[c]).map(c=>stepState(bid,c).status||"Not Started");
  if(!vals.length)return"";
  const live=vals.filter(v=>v!=="N/A");if(!live.length)return"N/A";
  if(live.every(v=>v==="Done"))return"Done";
  if(live.some(v=>v==="Done"||v==="In Progress"))return"In progress";
  return"Not done"}
const BOARD_MARK={"Done":"✓","In progress":"•","N/A":"–"};
const BOARD_CLS={"Done":"bd-done","In progress":"bd-prog","Not done":"bd-not","N/A":"bd-na","":"bd-na"};

  <div class="tw"><table class="grid board"><thead><tr><th class="stick" rowspan="2">Brand</th><th rowspan="2">SOW stage</th><th rowspan="2" class="num" title="Road to SOW: share of required steps done">Road to SOW</th>${groups.map((g,i)=>`<th colspan="${g.cols.length}" class="gh g${i%6}">${esc(g.name)}</th>`).join("")}${simple?"":`<th rowspan="2">Blocker</th>`}<th rowspan="2">Docs</th></tr>

  for(const{b,pct}of rows){const s=S.sow[b.id]||{};const hold=onHold(b);

  if(!rows.length)h+=`<tr><td colspan="${ncol+5}"><div class="empty">No brands yet.</div></td></tr>`;

function gateBlock(bid,code){const s=S.steps[code];if(!s||!s.is_gate)return"";const open=stepsSorted().filter(x=>x.order<s.order&&!x.is_optional&&!["Done","N/A"].includes(stepState(bid,x.code).status));

async function saveStep(bid,code,next){
  if(!db||!canWrite){toast("You can view this tracker but not change it.");return}
  const had=!!S.bsteps[bid];const doc=S.bsteps[bid]||{brand:bid,s:{}};const cur=(doc.s||{})[code]||{};
  if(S.steps[code]&&S.steps[code].is_gate&&next.status==="Done"&&cur.status!=="Done")next=Object.assign({},next,{approved_by:me||"",approved_at:isoToday()});
  if(next.status&&next.status!=="Done"&&cur.approved_by)next=Object.assign({},next,{approved_by:"",approved_at:""});
  if(cur.sent_back&&!("sent_back" in next))next=Object.assign({},next,{sent_back:null});
  const merged=Object.assign({},cur,next);
  const p={};for(const k of Object.keys(next))if(JSON.stringify(cur[k]??"")!==JSON.stringify(next[k]??""))p[k]=next[k];if(!Object.keys(p).length)return;
  const old={};for(const k of Object.keys(p))old[k]=cur[k];
  S.bsteps[bid]=Object.assign({},doc,{s:Object.assign({},doc.s||{},{[code]:merged})});render();
  return chain("bs/"+bid,()=>had?db.doc("brand_steps/"+bid).update({s:{[code]:merged},updated_at:Date.now()}):db.doc("brand_steps/"+bid).set({brand:bid,s:{[code]:merged},updated_at:Date.now()}))
   .then(()=>{toast("Saved");addLog("bsteps",bid,p,old,bname(bid)+" "+code)}).catch(e=>{if(!refused(e))toast("Not saved. Try again.");S.bsteps[bid]=doc;render()})}

  if(act==="ck"){const id=drawerCtx&&drawerCtx.id;const tk=S.tasks[id];if(!tk)return;const cl=(tk.checklist||[]).map(x=>Object.assign({},x));const x=cl[+t.dataset.i];if(!x)return;x.done=t.checked;save("tasks",id,{checklist:cl},tk.title+" checklist");return}
  if(act==="who"){me=t.value;ls.set("vt-me",me);if(db&&uid)db.doc("data/users/"+uid+"/profile").set({person:me}).catch(()=>{});render();return}
  if(act==="status"){const kind=t.dataset.kind,id=t.dataset.id,v=t.value;
    if(kind==="task"){const cur=S.tasks[id];t.value=cur.status;setTaskStatus(id,v)}
    else if(kind==="step"){const code=t.dataset.code;if(v==="Done"){const why=gateBlock(id,code);if(why){t.value=stepState(id,code).status||"Not Started";toast(why);return}}saveStep(id,code,{status:v})}
    else if(kind==="access"){const cur=S.access[id];if(v==="Blocked"&&!cur.blocker){t.value=cur.status;askBlocker(r=>{save("access",id,{status:"Blocked",blocker:r.text,owner:cur.owner||r.person},bname(cur.brand)+" "+cur.platform);accSystemNote(cur,id,"Blocked: "+r.text+" (waiting on "+r.person+")")});return}setAccStatus(id,v)}
    else if(kind==="sow"){const cur=S.sow[id]||{};if(v==="Blocked"&&!cur.blocker){t.value=cur.stage||"Not Started";askBlocker(r=>save("sow",id,{stage:"Blocked",blocker:r.text+" (waiting on "+r.person+")"},"SOW "+bname(id)));return}
      if(!S.sow[id])create("sow",id,{brand:id,stage:v},"SOW "+bname(id));else save("sow",id,{stage:v},"SOW "+bname(id))}
    return}
  if(act==="bpsec"){const id=t.dataset.id;const d=S.bps[id];save("bps",id,{sections:Object.assign({},d.sections||{},{[t.dataset.sec]:t.value})},"BPs "+bname(id));return}
  if(act==="fa"){flt[t.dataset.k]=t.value;render();return}
  if(act==="seat"){const id=drawerCtx&&drawerCtx.id;const a=S.access[id];if(!a)return;const seats=(a.seats||[]).map(x=>Object.assign({},x));const x=seats[+t.dataset.i];const old=x.s;x.s=t.value;save("access",id,{seats},bname(a.brand)+" "+a.platform+" logins");accSystemNote(a,id,`${x.p}: ${old} to ${x.s}`);return}
  if(act==="bps"){bpSort=t.value;render();return}
  if(act==="mgroup"){mineGroup[mineTab]=t.value;ls.set("vt-mgroup",JSON.stringify(mineGroup));render();return}
  if(act==="msort"){mineSort=t.value;ls.set("vt-msort",mineSort);render();return}
  if(act==="mvertsel"){mineVert=t.value;render();return}
  if(act==="pf"){if(t.dataset.k==="vert")peopleVert=t.value;else peopleDept=t.value;render();return}
  if(act==="use-tpl"&&t.value!==""){const tp=TEMPLATES()[+t.value];const bid=t.dataset.id;t.value="";if(!tp)return;
    confirmBox(`Add ${tp.tasks.length} tasks from "${tp.name}" to ${bname(bid)}?`,"Add tasks",async()=>{for(const x of tp.tasks){const d=new Date(today());d.setDate(d.getDate()+(x.days||0));
      await create("tasks",null,{brand:bid,title:x.title,owner:"",support:[],status:"Not Started",priority:"",start:isoToday(),deadline:x.days?d.toISOString().slice(0,10):"",notes:"From template: "+tp.name,brief_link:"",creative_link:"",blocker:null,department:x.department||"",department_auto:!x.department,vertical:tp.vertical||"",source:"Template: "+tp.name},bname(bid)+" "+x.title)}toast("Added "+tp.tasks.length+" tasks")});return}
  if(act==="bp-add"&&t.value){const id=t.value;create("bps",id,{brand:id,owner:"",due_date:"",sections:{},blocker:"",doc_link:"",notes:""},"BPs "+bname(id));return}
  if(act==="setbrand"&&t.value){save("tasks",t.dataset.id,{brand:t.value},S.tasks[t.dataset.id].title);return}
  if(act==="person"){const ps=people().map(p=>Object.assign({},p));const p=ps[+t.dataset.i];const f=t.dataset.f;
    if(f==="active")p.active=t.checked;else if(f==="leadership")p.leadership=t.checked;else if(f==="aliases")p.aliases=splitNames(t.value);else p[f]=t.value;savePeople(ps,p.name);return}
  if(act==="stepdef"){const id=t.dataset.id,f=t.dataset.f;const v=t.type==="checkbox"?t.checked:t.value.trim();if(f==="name"&&!v){toast("A step needs a name.");return}save("steps",id,{[f]:v},"Step "+id);return}
});
function savePeople(ps,label){save("config","people",{people:ps},"People: "+label)}

  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("kc")){e.preventDefault();e.target.click()}});
document.addEventListener("submit",e=>{const f=e.target;
  if(f.id==="cform"){e.preventDefault();const text=f.elements.text.value.trim(),bid=f.elements.brand.value;if(!text)return;
    if(!me){toast("Pick your name in the top bar first, so people know who wrote it.");return}
    create("comments",null,{brand:bid,text,by:me,at:Date.now(),mentions:mentionsIn(text)},"Comment on "+bname(bid)).then(id=>{if(id)f.reset()})}
  if(f.id==="aform"){e.preventDefault();const el=f.elements;const teams=[];for(let i=0;el["tn"+i];i++){const n=el["tn"+i].value.trim();if(!n)continue;teams.push({name:n,lead:el["tl"+i].value,platforms:el["tp"+i].value.split(",").map(x=>x.trim()).filter(Boolean)})}
    const bp_map={};L("bp_section").forEach((x,i)=>{const v=el["bm"+i].value.split(",").map(y=>y.trim()).filter(Boolean);if(v.length)bp_map[x]=v});
    const help={};L("platform").forEach((x,i)=>{const v=el["hp"+i].value.trim();if(v)help[x]=v});
    const body={teams,bp_map,help,chase_days:Math.max(1,+el.chase_days.value||2)};if(S.config.access_setup)save("config","access_setup",body,"Access setup");else create("config","access_setup",body,"Access setup")}
  if(f.id==="tform"){e.preventDefault();const name=f.elements.name.value.trim(),tasks=parseTemplateLines(f.elements.lines.value);
    if(!name||!tasks.length){toast("Give the template a name and at least one task.");return}saveTemplates(TEMPLATES().concat([{name,vertical:f.elements.vertical.value,tasks}]))}});
document.addEventListener("input",e=>{if(e.target.form&&e.target.form.id==="dform"&&e.target.name)drawerDirty[e.target.name]=e.target.value;if(e.target.id==="q"){searchQ=e.target.value;renderSearch()}if(e.target.id==="acc-find"){const q=e.target.value.trim().toLowerCase();document.querySelectorAll(".accb").forEach(b=>b.hidden=!!q&&!b.dataset.n.includes(q))}});
document.addEventListener("focusout",e=>{if(e.target.id==="q")setTimeout(()=>{if(!$(".search")||!$(".search").contains(document.activeElement)){const b=$("#sres");if(b)b.hidden=true;renderTop()}},150)});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"")){const q=$("#q");if(q){e.preventDefault();q.focus()}}
  if(e.target.id==="q"&&e.key==="Enter"){const first=$("#sres .sr-row");if(first)first.click()}
  if(e.target.id==="q"&&e.key==="Escape"){searchQ="";e.target.value="";renderSearch();e.target.blur()}});

/* ---------- export ---------- */
function loadXlsx(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s)})}
async function offer(filename,data){if(!dl){toast("Downloads are not available in this view.");return}try{await dl.save({filename,data});toast("Downloaded")}catch(e){if(e&&e.code!=="declined")toast("The download did not finish.")}}
async function exportXlsx(){
  let X;try{X=await loadXlsx()}catch(e){toast("Could not load the Excel library. Try again.");return}
  const wb=X.utils.book_new();const add=(name,rows)=>X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(rows),name.replace(/[\\\/?*\[\]:]/g,"").slice(0,31));
  const bs=brandList();
  add("Brand Tracker",[["Brand","Founder","Website","Stage","Brand Lead","Open Tasks","Blocked Tasks","Overdue Tasks","Platform Access","Access Granted","SOW Stage","SOW Owner","SOW Target Sign","BPs","BP Progress","Road to SOW %","Health","Next Step"]]
    .concat(bs.map(b=>{const r=roll(b.id);return[b.name,b.founder,b.website,b.stage,b.lead,r.open,r.blocked,r.overdue,r.acc.summary,r.acc.text,r.sow,r.sowRow.owner||"",r.sowRow.target_sign||"",r.bp?r.bp.overall:"",r.bp?Math.round(r.bp.progress*100)/100:"",Math.round(r.pct*100)/100,r.health,b.next_step]})));
  for(const b of bs){const ts=withId(S.tasks).filter(t=>t.brand===b.id);add(b.name,[["Task / Deliverable","Campaign","Owner","Support Team","Status","Priority","Start Date","Deadline","Due Flag","Notes / Next Step","Brief Link","Creative Link"]]
    .concat(ts.map(t=>[t.title,campOf(t)===NOCAMP?"":campName(campOf(t)),t.owner,(t.support||[]).join(", "),t.status,t.priority,t.start,t.deadline,dueFlag(t.deadline,t.status==="Complete"),t.notes,t.brief_link,t.creative_link])))}
  add("Campaigns",[["Brand","Campaign","Status","Owner","Start","Launch or End","What It Is For","Success Looks Like","Open Tasks","Done Tasks","Open Dependencies","Link"]].concat(withId(S.camps).map(c=>{const r=campRoll(c.brand,c._id);return[bname(c.brand),c.name,c.status||"",c.owner||"",c.start||"",c.end||"",c.purpose||"",c.goal||"",r.op.length,r.done,(c.deps||[]).filter(d=>d.state!=="Cleared").map(d=>d.text).join("; "),c.link||""]})));
  add("Platform Access",[["Brand","Platform","Team","Status","Access Type","How Given","Team Logins","Next Step","Next Step Who","Next Step By","Last Chased","Needed For","Valerie Owner","Brand Contact","Asked Founder On","Deadline","Blocker","Notes"]].concat(withId(S.access).map(a=>{const ns=a.next_step||{};return[bname(a.brand),a.platform,accTeamOf(a),a.status,a.access_level,a.access_via||"",(a.seats||[]).map(x=>x.p+" ("+x.s+")").join(", "),ns.text||"",ns.who||"",ns.due||"",ACC_FOUNDER.includes(a.status)?lastContact(a):"",a.needed_for,a.owner,a.brand_contact,a.requested_date,a.deadline,a.blocker,a.notes]})));
  add("SOW Tracker",[["Brand","SOW Owner","Support Team","SOW Stage","Start Date","Draft Due","Target Sign Date","Due Flag","Blocker / Dependency","Next Step","SOW Link","GF Link","Updated GF?","Batch","GF Status"]].concat(bs.filter(b=>S.sow[b.id]).map(b=>{const s=S.sow[b.id];return[b.name,s.owner,(s.support||[]).join(", "),s.stage,s.start_date,s.draft_due,s.target_sign,sowDue(s),s.blocker,s.next_step,s.sow_link,s.gf_link,s.gf_updated?"yes":"",s.batch,s.gf_status||""]})));
  const secs=L("bp_section");add("BP Tracker",[["Brand","BP Owner","Due Date","Due Flag"].concat(secs,["Progress","Overall","Blocker","BP Doc Link","Notes"])].concat(bs.filter(b=>S.bps[b.id]).map(b=>{const d=S.bps[b.id],r=bpRoll(b.id);return[b.name,d.owner,d.due_date,r.due].concat(secs.map(x=>(d.sections||{})[x]||""),[Math.round(r.progress*100)/100,r.overall,d.blocker,d.doc_link,d.notes])})));
  const st=stepsSorted();add("Onboarding Steps",[["Phase","Code","Step"].concat(bs.map(b=>b.name))].concat([["","","Road to SOW %"].concat(bs.map(b=>Math.round(onboarding(b.id)*100)/100))],st.map(s=>[s.phase+" "+s.phase_name,s.code,s.name].concat(bs.map(b=>stepState(b.id,s.code).status||"")))));
  add("Completed Archive",[["Brand","Task / Deliverable","Owner","Support Team","Start Date","Deadline","Notes"]].concat(withId(S.tasks).filter(t=>!t.brand).map(t=>["",t.title,t.owner,(t.support||[]).join(", "),t.start,t.deadline,t.notes])));
  const lk=["task_status","priority","stage","platform","access_level","access_status","sow_stage","checklist","bp_section","bp_status"];const heads=["Task Status","Priority","Stage","Team","Platform","Access Level","Access Status","SOW Stage","Checklist","BP Section","BP Status"];
  const cols=[L("task_status"),L("priority"),L("stage"),activePeople()].concat(lk.slice(3).map(L));const n=Math.max(...cols.map(c=>c.length));const rows=[heads];for(let i=0;i<n;i++)rows.push(cols.map(c=>c[i]||""));add("Lists",rows);
  const out=X.write(wb,{bookType:"xlsx",type:"array"});
  await offer("Valerie_COE_Tracker_"+isoToday()+".xlsx",new Blob([out]))}

    scheduleRender()},err=>{if(err&&err.code!=="revoked")toast("Live updates paused. Reload the page.")});
  for(const[k,c]of Object.entries(COLL))sub(k,c);
  db.collection("log").orderBy("date","desc").limit(30).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});S.log=o;if(route.v==="settings")render()},()=>{});
})();
