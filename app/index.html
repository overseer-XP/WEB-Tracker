<title>Valerie COE Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Calm palette: misty sage-grey ground, soft teal accent, pastel status fills. Layout: left rail, top bar with search and Simple / Full, work area, edit drawer */
:root{
  --bg:#F3F6F5; --panel:#FFFFFF; --panel2:#EDF2F0; --ink:#2A3337; --muted:#66747A; --faint:#94A0A5; --line:#E1E8E5; --line2:#D0D9D5;
  --rail:#EAF0ED; --railHover:#DEE7E3; --accent:#3D7486; --accentInk:#FFFFFF; --accentSoft:#DFECEF;
  --ok:#3E7C5A; --okBg:#E2F0E7; --warn:#8A6727; --warnBg:#F7EDD8; --bad:#A4514B; --badBg:#F6E2DF;
  --info:#4B6C8C; --infoBg:#E3EBF3; --off:#66747A; --offBg:#ECF0EE;
  --fDone:#A9D0B6; --fProg:#CFC2E8; --fNot:#F4E2DF; --fNA:#E7ECEA;
  --dLive:#6EAD86; --dRisk:#D6A44C; --dTrack:#86ABCF;
  --g0:#8DB89B; --g1:#8FB0CF; --g2:#B5A4D5; --g3:#D6A98B; --g4:#93C1AF; --g5:#C7B88A;
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161B1D; --panel:#1E2427; --panel2:#252C30; --ink:#E1E7E8; --muted:#A2AEB2; --faint:#7B878B; --line:#2E373B; --line2:#3A4448;
  --rail:#1A2023; --railHover:#253034; --accent:#86B9CA; --accentInk:#10181B; --accentSoft:#22353B;
  --ok:#8CC6A1; --okBg:#1E3227; --warn:#E0BF7E; --warnBg:#38301F; --bad:#E3A09A; --badBg:#3D2624;
  --info:#9DBAD8; --infoBg:#212F3B; --off:#ADB8BC; --offBg:#293033;
  --fDone:#4D7B60; --fProg:#64578A; --fNot:#48302E; --fNA:#2C3437;
  --dLive:#7BBE95; --dRisk:#D9AE5E; --dTrack:#8FB3D6;
  --g0:#5E8A6D; --g1:#5F80A0; --g2:#7F70A3; --g3:#A37B5F; --g4:#5F9483; --g5:#978A5F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161B1D; --panel:#1E2427; --panel2:#252C30; --ink:#E1E7E8; --muted:#A2AEB2; --faint:#7B878B; --line:#2E373B; --line2:#3A4448;
  --rail:#1A2023; --railHover:#253034; --accent:#86B9CA; --accentInk:#10181B; --accentSoft:#22353B;
  --ok:#8CC6A1; --okBg:#1E3227; --warn:#E0BF7E; --warnBg:#38301F; --bad:#E3A09A; --badBg:#3D2624;
  --info:#9DBAD8; --infoBg:#212F3B; --off:#ADB8BC; --offBg:#293033;
  --fDone:#4D7B60; --fProg:#64578A; --fNot:#48302E; --fNA:#2C3437;
  --dLive:#7BBE95; --dRisk:#D9AE5E; --dTrack:#8FB3D6;
  --g0:#5E8A6D; --g1:#5F80A0; --g2:#7F70A3; --g3:#A37B5F; --g4:#5F9483; --g5:#978A5F; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;overflow:hidden}
.app>*{min-height:0}
/* rail */
.rail{background:var(--rail);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px 24px;display:flex;flex-direction:column;gap:14px}
.mark{padding:0 8px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.mark small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.blink{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:6px;color:var(--ink);text-decoration:none}
.nav a:hover,.blink:hover{background:var(--railHover)}
.nav a.on,.blink.on{background:var(--accentSoft);color:var(--accent);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted)}
.rail h3{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:8px 9px 2px}
.blink{font-size:13px}
.blink .n{margin-left:auto;font-size:12px;color:var(--muted)}
.blink .tag{margin-left:4px}
.addbtn{border:1px dashed var(--line2);background:transparent;border-radius:6px;padding:6px;cursor:pointer;color:var(--muted)}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
/* health dot */
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--off);display:inline-block}
.dot.h-Blocked{background:var(--bad);border-radius:2px}
.dot.h-AtRisk{background:var(--dRisk)}
.dot.h-OnTrack{background:var(--dTrack)}
.dot.h-Live{background:var(--dLive)}
.dot.h-Hasblockers,.dot.h-HasBlockers{background:transparent;box-shadow:inset 0 0 0 2.5px var(--bad)}
.dot.h-OnHold{background:transparent;box-shadow:inset 0 0 0 2px var(--faint)}
/* top */
.mainwrap{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 28px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.topbar .menu{display:none}
.topbar .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accentSoft);color:var(--accent);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 14px}
.toolbar .tl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.toolbar select{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 6px;color:var(--ink)}
.fold{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;width:20px;padding:0}
.gl{font-size:15px}.flat{display:flex;flex-direction:column}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol.kbad{background:color-mix(in srgb,var(--badBg) 55%,var(--panel2))}
.kh{display:flex;align-items:center;gap:6px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:5px}
.kcard .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.kcard.blocked,.kcard.late{border-left:3px solid color-mix(in srgb,var(--bad) 60%,transparent)}.kcard.soon{border-left:3px solid var(--dRisk)}
.hint2{color:var(--muted);font-size:13px;margin:-6px 0 10px}
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.pcol{padding:12px 12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.pcol:last-child{border-right:0}.pcol.held{background:var(--panel2)}
.ph{display:flex;align-items:baseline;gap:7px;padding-bottom:8px;margin-bottom:4px;border-bottom:2px solid var(--accentSoft)}
.ph b{font-size:20px;font-weight:700;letter-spacing:-.02em}.ph span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);text-decoration:none;padding:2px 0}
.pb:hover span{text-decoration:underline}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.who select{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 6px}
main{overflow-y:auto;padding:24px 28px 80px;flex:1;min-width:0;min-height:0}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px;font-weight:700;text-wrap:balance}
h2{font-size:16px;margin:26px 0 10px;font-weight:600}
.sub{color:var(--muted);margin:0 0 18px;max-width:72ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:600}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.missing{border:1px dashed var(--line2);background:transparent;color:var(--muted);border-radius:6px;padding:2px 8px;font-size:12.5px;cursor:pointer}
.missing:hover{color:var(--accent);border-color:var(--accent)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0 6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em}
.tile span{color:var(--muted);font-size:12.5px}
.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--warn)}
/* sow plan strip */
.plan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.week{padding:10px 12px;border-right:1px solid var(--line);min-width:0}
.week:last-child{border-right:0}
.week h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
.week h4 b{color:var(--ink)}
.week .chip{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0;color:var(--ink);text-decoration:none;flex-wrap:wrap}
.week .chip:hover span.nm{text-decoration:underline}
/* tables */
.tw{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
td.num,th.num{text-align:right}
td .hot{color:var(--bad);font-weight:600}
.bname{font-weight:600;color:var(--ink);text-decoration:none}
.bname:hover{text-decoration:underline}
.clip{max-width:420px;min-width:220px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.code{font-family:var(--f-code);font-size:12px;color:var(--muted)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:20px}
.s-ok{background:var(--okBg);color:var(--ok)}.s-warn{background:var(--warnBg);color:var(--warn)}.s-bad{background:var(--badBg);color:var(--bad)}
.s-info{background:var(--infoBg);color:var(--info)}.s-off{background:var(--offBg);color:var(--off)}
select.ps{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:1px 22px 1px 9px;font-size:12px;font-weight:600;cursor:pointer;line-height:20px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px;background-repeat:no-repeat}
select.ps:disabled{cursor:default;background-image:none;padding-right:9px}
.tag{font-size:11px;padding:0 6px;border-radius:999px;background:var(--offBg);color:var(--off);white-space:nowrap;line-height:18px;display:inline-block}
.tag.gate{background:var(--badBg);color:var(--bad);font-weight:600}
.tag.opt{background:transparent;border:1px dashed var(--line2)}
.tag.doc{background:var(--infoBg);color:var(--info)}
.tag.bad{background:var(--badBg);color:var(--bad);font-weight:600}
.tag.warn{background:var(--warnBg);color:var(--warn);font-weight:600}
.due{font-size:12.5px;white-space:nowrap}
.due.Overdue{color:var(--bad);font-weight:600}.due.DueSoon{color:var(--warn);font-weight:600}
/* team cards */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.team{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.team:hover{border-color:var(--accent)}.team:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.team.t-bad{border-top:3px solid color-mix(in srgb,var(--bad) 60%,transparent)}.team.t-late{border-top:3px solid var(--dRisk)}
.team .th{display:flex;align-items:baseline;gap:8px}.team .tn{font-weight:700;font-size:15px}.team .tc{margin-left:auto;font-weight:600;color:var(--muted);font-size:13px}
.team .tstat{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.bar.wide{width:100%}
.team .tlist{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:8px}
.team .tl{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.team .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .tw2{font-size:12px;white-space:nowrap}
.team .more{font-size:12px;color:var(--accent);font-weight:600}
.team.empty-team{flex-direction:row;justify-content:space-between;align-items:center;background:transparent;border-style:dashed;padding:10px 14px}
.teamnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chipbtn{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px;color:var(--ink)}
.chipbtn span{color:var(--muted);margin-left:3px}
.chipbtn.on{background:var(--accentSoft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);font-weight:600}.chipbtn.on span{color:var(--accent);opacity:.75}
/* my tasks */
.group{margin-bottom:18px}
.group h2{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.group h2 .count{font-size:12px;color:var(--muted);font-weight:500}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px}
.item .t{font-weight:600}
.tile em.tr{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:4px}.tile em.tr.up{color:var(--ok)}.tile em.tr.down{color:var(--bad)}
.tile span i{font-style:normal}
.att td{vertical-align:middle}
.hyg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--warnBg);color:var(--warn);border-radius:var(--r);padding:9px 14px;margin:12px 0 0;font-size:13px}
.hyg a{color:var(--warn);text-decoration:underline}
.pb .days{font-style:normal;font-size:11px;color:var(--faint);margin-left:auto}
.search{position:relative;flex:1;min-width:220px;max-width:420px}
.bhead>div:first-child{min-width:0}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.att td.muted{max-width:560px}
.search input{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 10px}
.sres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 14%,transparent);z-index:30;max-height:60vh;overflow:auto;padding:4px}
.sr-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:0 8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:6px;cursor:pointer}
.sr-row:hover,.sr-row:focus{background:var(--accentSoft)}.sr-type{grid-row:span 2;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.sr-l{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sr-s{font-size:12px}.sr-none{padding:10px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.since{background:var(--infoBg);color:var(--info);border-radius:var(--r);padding:9px 14px;margin:0 0 12px;font-size:13px}
.since.faint{background:transparent;padding:0 2px}
a.item.men{text-decoration:none;color:var(--ink);border-left:3px solid var(--accent)}
.mention{color:var(--accent)}
.guide{display:flex;gap:14px;align-items:flex-start;background:var(--accentSoft);border-radius:var(--r);padding:10px 14px;margin:0 0 14px;font-size:13px}
.guide ul{margin:4px 0 0;padding-left:18px}.guide>div{flex:1}
.upd{align-items:start}.h3{font-size:14px;margin:0 0 8px}
.cform textarea{width:100%;min-height:72px;border:1px solid var(--line2);border-radius:6px;padding:8px;background:var(--panel);resize:vertical}
.cform{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.cmt{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.ctext{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.actlist{padding:4px 12px}.act{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.act:last-child{border-bottom:0}
.load{display:inline-block;width:110px;height:8px;background:var(--offBg);border-radius:9px;overflow:hidden;vertical-align:middle;margin-right:6px}
.load i{display:block;height:100%;background:var(--dTrack)}.load.warn i{background:var(--dRisk)}
tr.sel td{background:var(--accentSoft)}
.sortb{border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;text-transform:inherit;letter-spacing:inherit}
.sortb:hover,.sortb.on{color:var(--accent)}
.tag.ok{background:var(--okBg);color:var(--ok)}
.bd{font-size:12px;font-weight:700;color:var(--ink)}.bdl{font-size:10px;line-height:12px;text-align:center;color:var(--ink)}
.client{max-width:760px}.client .ceyebrow{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 0}.client h1{font-size:28px;margin:4px 0 16px}
.cstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.cstats div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}.cstats b{display:block;font-size:20px}.cstats span{color:var(--muted);font-size:13px}
.cgroups{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}.cg{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}.cg:last-child{border-bottom:0}.cn{flex:1;font-weight:600}.cs{color:var(--muted);font-size:13px}
.cdot{width:12px;height:12px;border-radius:50%;background:var(--fNA)}.c-Done{background:var(--dLive)}.c-Inprogress{background:var(--fProg)}
.flash,.flash td{background:var(--accentSoft)!important;transition:background .6s}
@media (prefers-reduced-motion:reduce){.flash,.flash td{transition:none}}
.cnt{font-size:11.5px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--offBg);color:var(--off);font-weight:600}
.cnt.bad{background:var(--badBg);color:var(--bad)}
.bcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 6px;margin-bottom:14px}
.bcard.held{opacity:.7}
.bcard header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 10px}
.bcard header .bname{font-size:15px}
.bprog{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.bprog .bar{width:90px}
.item .meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.item.blocked{border-left:3px solid color-mix(in srgb,var(--bad) 60%,transparent)}

.g0{--g:var(--g0)}.g1{--g:var(--g1)}.g2{--g:var(--g2)}.g3{--g:var(--g3)}.g4{--g:var(--g4)}.g5{--g:var(--g5)}

<div class="app">
  <aside class="rail" id="rail" aria-label="Navigation"></aside>
  <div class="mainwrap">
    <div class="topbar" id="topbar"></div>
    <main id="main"><h1>Valerie COE Tracker</h1><p class="sub">Loading brands, tasks and steps.</p></main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Edit"></aside>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
/* ---------- state ---------- */
const COLL={brands:"brands",tasks:"tasks",access:"access",sow:"sow",bps:"bps",steps:"steps",bsteps:"brand_steps",config:"config",comments:"comments",snaps:"snapshots"};
const S={brands:{},tasks:{},access:{},sow:{},bps:{},steps:{},bsteps:{},config:{},comments:{},snaps:{},log:{}};
const ready={};
let db=null,U=null,uid=null,canEdit=false,canWrite=true,dl=null;
let me="";               // the person this viewer picked
let simple=null;          // null until we know the role
let lens="";              // "leadership" when a leadership person turns on the leadership view
let route={v:"",id:""};
let brandTab="tasks",showAllPhases=false,drawerCtx=null;
const flt={accBrand:"",accStatus:"",taskStatus:"open",accGap:false};
let accView="grid",sowView="board";
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// Light by default, whatever the device is set to. Each person can switch to dark.
let theme=ls.get("vt-theme")==="dark"?"dark":"light";
const applyTheme=()=>{document.documentElement.setAttribute("data-theme",theme)};applyTheme();
new MutationObserver(()=>{if(document.documentElement.getAttribute("data-theme")!==theme)applyTheme()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
try{const t=ls.get("vt-tab");if(t)brandTab=t;const sv=ls.get("vt-simple");if(sv!==null)simple=sv==="1";if(ls.get("vt-lens")==="leadership")lens="leadership";me=ls.get("vt-me")||"";accView=ls.get("vt-accview")||"grid";sowView=ls.get("vt-sowview")||"board"}catch(e){}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=s=>String(s||"").replace(/[^A-Za-z]/g,"");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2400)}
const L=n=>(S.config.lists&&S.config.lists[n])||[];
const people=()=>((S.config.people&&S.config.people.people)||[]);
const activePeople=()=>people().filter(p=>p.active!==false).map(p=>p.name).sort((a,b)=>a.localeCompare(b));
function namesFor(person){const p=people().find(x=>x.name===person);return [person].concat(p&&p.aliases||[]).filter(Boolean).map(s=>s.toLowerCase())}
function isPerson(val,person){if(!val||!person)return false;const ns=namesFor(person);return ns.includes(String(val).toLowerCase().trim())}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function isoToday(){const d=today();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseD(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
const dayDiff=s=>{const d=parseD(s);return d?Math.round((d-today())/864e5):null};
function fmtD(s,long){const d=parseD(s);if(!d)return"";return d.toLocaleDateString("en-GB",long?{weekday:"short",day:"numeric",month:"short"}:{day:"numeric",month:"short"})}
/* Excel rule: blank if done or no date; Overdue if before today; Due Soon if within 3 days; else On Time */
function dueFlag(date,done){if(done)return"";const n=dayDiff(date);if(n===null)return"";if(n<0)return"Overdue";if(n<=3)return"Due Soon";return"On Time"}
function dueText(date,flag){const n=dayDiff(date);if(n===null)return"";if(flag==="Overdue")return"Late by "+(-n)+(n===-1?" day":" days");if(n===0)return"Due today";if(n===1)return"Due tomorrow";return"Due "+fmtD(date,true)}
function dueHtml(date,done){const f=dueFlag(date,done);if(!f)return date&&done?`<span class="due faint">${esc(fmtD(date))}</span>`:"";return`<span class="due ${key(f)}">${esc(dueText(date,f))}</span>`}
function cls(v){
  if(["Complete","Granted","Signed","Done","Live","All Granted","On Time","On Track"].includes(v))return v==="On Track"?"s-info":"s-ok";
  if(["Blocked","Overdue","Urgent"].includes(v))return"s-bad";
  if(["At Risk","Has blockers","Due Soon","High","In Progress","Briefed","Requested","Template Pending","Drafting","Internal Review","Final Review (Ben)","Founder Check-in","Revisions","Sent for Signature","Foundations","Tactics In","In QA"].includes(v))return"s-warn";
  if(["Pending","Not Requested","Medium","Not Started","Not Set Up"].includes(v))return"s-info";
  return"s-off";
}
const pill=v=>v?`<span class="pill ${cls(v)}">${v==="Blocked"?"! ":""}${esc(v)}</span>`:"";
const hdot=h=>`<span class="dot h-${key(h)}" aria-hidden="true"></span>`;
const brandList=()=>Object.entries(S.brands).map(([id,b])=>Object.assign({id},b)).sort((a,b)=>(a.order||999)-(b.order||999)||String(a.name).localeCompare(b.name));
const bname=id=>(S.brands[id]&&S.brands[id].name)||"";
const isInternal=b=>(b&&b.stage)==="Internal";
/* on hold = brand stage On Hold or the Paused flag. Every screen uses this one test. */
const onHold=b=>!!b&&(b.stage==="On Hold"||!!b.paused);
const holdOf=bid=>onHold(S.brands[bid]);
const stepBlocks=bid=>Object.values((S.bsteps[bid]&&S.bsteps[bid].s)||{}).filter(x=>x&&x.blocker&&x.blocker.text&&!["Done","N/A"].includes(x.status)).length;
const stepsSorted=()=>Object.entries(S.steps).map(([id,s])=>Object.assign({id},s)).sort((a,b)=>a.order-b.order);
function phases(){const out=[];for(const s of stepsSorted()){let p=out.find(x=>x.code===s.phase);if(!p){p={code:s.phase,name:s.phase_name,steps:[]};out.push(p)}p.steps.push(s)}return out}
const stepState=(bid,code)=>((S.bsteps[bid]&&S.bsteps[bid].s)||{})[code]||{};
const withId=o=>Object.entries(o).map(([k,v])=>Object.assign({_id:k},v));
const opts=(arr,cur,blank)=>{const list=arr.slice();if(cur&&!list.includes(cur))list.push(cur);return(blank!==false?`<option value=""></option>`:"")+list.map(o=>`<option value="${esc(o)}" ${o===cur?"selected":""}>${esc(o)}</option>`).join("")};

/* ---------- roll-ups (from the Excel formulas) ---------- */
function bpRoll(bid){const d=S.bps[bid];if(!d)return null;const secs=L("bp_section");const vals=secs.map(x=>(d.sections||{})[x]||"Not Started");
  const live=vals.filter(v=>v!=="N/A");const done=live.filter(v=>v==="Complete").length;const progress=live.length?done/live.length:0;
  let overall="In Progress";
  if(vals.includes("Blocked"))overall="Blocked";else if(done===live.length)overall="Complete";else if(vals.every(v=>v==="Not Started"||!v))overall="Not Started";else if(vals.includes("In QA"))overall="In QA";
  return{overall,progress,done,total:live.length,due:dueFlag(d.due_date,progress===1)}}
function accessRoll(bid){const rows=Object.values(S.access).filter(a=>a.brand===bid&&a.status!=="Not Needed");const g=rows.filter(a=>a.status==="Granted").length;
  let s="Not Set Up";if(rows.length)s=rows.some(a=>a.status==="Blocked")?"Blocked":g===rows.length?"All Granted":"In Progress";return{summary:s,text:rows.length?g+" / "+rows.length:""}}
const sowDue=s=>!s||s.stage==="Signed"?"":dueFlag(s.target_sign||s.draft_due,false);
function onboarding(bid){const st=stepsSorted();let na=0,done=0;for(const s of st){const v=stepState(bid,s.code).status;if(v==="N/A")na++;else if(v==="Done")done++}const tot=st.length-na;return tot?done/tot:0}
function roll(bid){return memo("roll:"+bid,()=>rollNow(bid))}
function tasksOf(bid){return memo("tasksBy",()=>{const m={};for(const t of Object.values(S.tasks))if(t.title)(m[t.brand]=m[t.brand]||[]).push(t);return m})[bid]||[]}
function rollNow(bid){
  const b=S.brands[bid]||{};
  const ts=tasksOf(bid);
  const open=ts.filter(t=>t.status!=="Complete").length;
  const blocked=ts.filter(t=>t.status==="Blocked").length;
  const overdue=ts.filter(t=>dueFlag(t.deadline,t.status==="Complete")==="Overdue").length;
  const acc=accessRoll(bid);const s=S.sow[bid];const sow=isInternal(b)?"N/A":(s?(s.stage||"Not Started"):"Not Set");
  const bp=bpRoll(bid);const pct=onboarding(bid);
  const why=[];let whyTab="";const reason=(t,tab)=>{why.push(t);if(!whyTab)whyTab=tab};
  if(sow==="Blocked")reason("SOW blocked"+(s&&s.blocker?": "+s.blocker:""),"sow");
  if(acc.summary==="Blocked")reason("Platform access blocked","access");
  if(bp&&bp.overall==="Blocked")reason("Best Practices blocked","bp");
  for(const st of stepsSorted())if(st.is_gate){const x=stepState(bid,st.code);if(x.blocker&&x.blocker.text&&!["Done","N/A"].includes(x.status))reason("Gate step blocked: "+st.name,"steps")}
  for(const t of ts)if(t.status==="Blocked"&&["High","Urgent"].includes(t.priority))reason(t.title+(t.blocker&&t.blocker.text?": "+t.blocker.text:""),"tasks");
  let health="On Track";
  if(onHold(b))health="On Hold";
  else if(why.length)health="Blocked";
  else if(overdue>0)health="At Risk";else if(blocked>0)health="Has blockers";else if(sow==="Signed")health="Live";
  return{open,blocked,overdue,acc,sow,sowRow:s||{},bp,pct,health,why,whyTab,hold:onHold(b),stepBlocked:stepBlocks(bid)}}

/* ---------- writes + change log ---------- */
const wq={};
function chain(k,fn){wq[k]=(wq[k]||Promise.resolve()).then(fn,fn);return wq[k]}
function refused(e){if(e&&e.code==="invalid_argument"){canWrite=false;toast("You can view this tracker but not change it.");render();return true}return false}
async function save(c,id,patch,label){
  if(!db||!canWrite){toast("You can view this tracker but not change it.");return}
  const cur=S[c][id];if(c==="brands"&&patch.stage&&cur&&patch.stage!==cur.stage)patch=Object.assign({},patch,{stage_since:isoToday()});
  const old={};for(const k of Object.keys(patch))old[k]=cur?cur[k]:undefined;
  S[c][id]=Object.assign({},cur||{},patch);render();
  const body=Object.assign({},patch,{updated_at:Date.now(),updated_by:uid||""});
  return chain(c+"/"+id,()=>(cur?db.doc(COLL[c]+"/"+id).update(body):db.doc(COLL[c]+"/"+id).set(Object.assign({},S[c][id],body))))
    .then(()=>{toast("Saved");addLog(c,id,patch,old,label)})
    .catch(e=>{if(!refused(e))toast("Not saved. Check your connection and try again.");if(cur)S[c][id]=cur;render()});
}
async function create(c,id,body,label){
  if(!db||!canWrite){toast("You can view this tracker but not change it.");return null}
  const ref=id?db.doc(COLL[c]+"/"+id):db.collection(COLL[c]).doc();
  const full=Object.assign({},body,{created_at:Date.now(),updated_at:Date.now(),updated_by:uid||""});
  S[c][ref.id]=full;render();
  try{await ref.set(full);addLog(c,ref.id,{created:label||"new"},{}, label);toast("Added");return ref.id}
  catch(e){delete S[c][ref.id];render();if(!refused(e))toast(e&&e.code==="quota_exceeded"?"The tracker is full. Ask an admin to archive old rows.":"Not added. Try again.");return null}
}
async function remove(c,id,label){
  if(!db||!canWrite)return;const cur=S[c][id];delete S[c][id];render();
  try{await db.doc(COLL[c]+"/"+id).delete();addLog(c,id,{deleted:true},{},label);toast("Deleted")}catch(e){S[c][id]=cur;render();if(!refused(e))toast("Not deleted. Try again.")}
}
let logBuf=null;
function addLog(c,id,patch,old,label){
  const day=isoToday();const lid=day+"_"+(uid||"anon");
  const entries=[];for(const k of Object.keys(patch)){if(k==="updated_at"||k==="updated_by")continue;
    const f=v=>v==null?"":typeof v==="object"?JSON.stringify(v).slice(0,140):String(v).slice(0,140);
    entries.push({at:Date.now(),what:COLL[c]||c,id,label:label||"",field:k,old:f(old[k]),new:f(patch[k])})}
  if(!entries.length)return;
  chain("log/"+lid,async()=>{const base=(S.log[lid]&&S.log[lid].entries)||[];const all=base.concat(entries).slice(-400);
    const body={date:day,who:uid||"",person:me||"",entries:all};S.log[lid]=body;try{await db.doc("log/"+lid).set(body)}catch(e){}});
}

/* ---------- routing ---------- */
function parseHash(){const h=location.hash.replace(/^#/,"");

const MINE_GROUPS=[["brand","Brand"],["priority","Priority"],["due","Due date"],["status","Status"],["team","Team"],["none","No groups"]];

function dueBucket(it){if(!it.due)return["5","No date"];const n=dayDiff(it.due);if(n<0)return["0","Late"];if(n===0)return["1","Due today"];if(n<=7)return["2","Due in the next 7 days"];if(n<=30)return["3","Due this month"];return["4","Later"]}
function mineGroups(items,by){const m=new Map();

const DAY=864e5;
function lastUpdated(bid){return memo("lu",()=>{const idx={};const take=(b,d)=>{if(!d||!b)return;const v=+d.updated_at||+d.created_at||0;if(v>(idx[b]||0))idx[b]=v};
  for(const[id,d]of Object.entries(S.brands))take(id,d);for(const[id,d]of Object.entries(S.sow))take(id,d);for(const[id,d]of Object.entries(S.bps))take(id,d);for(const[id,d]of Object.entries(S.bsteps))take(id,d);
  for(const t of Object.values(S.tasks))take(t.brand,t);for(const a of Object.values(S.access))take(a.brand,a);for(const c of Object.values(S.comments))take(c.brand,c);return idx})[bid]||0}
function lastUpdatedSlow(bid){let m=0;const take=d=>{if(!d)return;const v=+d.updated_at||+d.created_at||0;if(v>m)m=v};
  take(S.brands[bid]);take(S.sow[bid]);take(S.bps[bid]);take(S.bsteps[bid]);
  for(const t of Object.values(S.tasks))if(t.brand===bid)take(t);for(const a of Object.values(S.access))if(a.brand===bid)take(a);
  for(const c of Object.values(S.comments))if(c.brand===bid)take(c);return m}
function agoText(ts){if(!ts)return"";const d=Math.floor((Date.now()-ts)/DAY);return d<=0?"today":d===1?"yesterday":d+" days ago"}
function stageDays(b){const d=parseD(b&&b.stage_since);return d?Math.max(0,Math.round((today()-d)/DAY)):null}

/* ---------- needs attention: the exceptions leadership should act on ---------- */
function attention(bs,R){const out=[];
  for(const b of bs){if(isInternal(b)||onHold(b))continue;const r=R[b.id];const s=S.sow[b.id]||{};const add=(kind,text,tab)=>out.push({b,kind,text,tab});
    if(r.health==="Blocked")add("Blocked",r.why[0]||"Blocked",r.whyTab||"tasks");
    if(s.target_sign&&s.stage!=="Signed"&&dayDiff(s.target_sign)<0)add("Past SOW target",`Target ${fmtD(s.target_sign,true)}, SOW ${s.stage||"Not Started"}`,"sow");
    if(b.stage==="Live"&&s.stage&&s.stage!=="Signed")add("Stage mismatch",`Brand is Live but the SOW is ${s.stage}`,"sow");
    if(s.stage==="Signed"&&b.stage!=="Live")add("Stage mismatch",`SOW is Signed but the brand is at ${b.stage}`,"sow");
    const lu=lastUpdated(b.id);if(lu&&Date.now()-lu>7*DAY)add("No update",`Nothing changed for ${Math.floor((Date.now()-lu)/DAY)} days`,"updates")}
  const order={"Blocked":0,"Past SOW target":1,"Stage mismatch":2,"No update":3};
  return out.sort((x,y)=>order[x.kind]-order[y.kind])}

function parseTemplateLines(text){return text.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const[title,dep,days]=l.split("|").map(x=>(x||"").trim());return{title,department:DEPTS().includes(dep)?dep:"",days:+days||0}}).filter(x=>x.title)}

/* ---------- client status page: one brand, no internal notes ---------- */
function clientModel(bid){const b=S.brands[bid]||{};const s=S.sow[bid]||{};const groups=boardCols();
  const g=groups.map(gr=>{const vals=gr.cols.map(c=>boardCell(bid,c)).filter(v=>v&&v!=="N/A");const done=vals.filter(v=>v==="Done").length;
    return{name:gr.name,state:!vals.length?"Not started":done===vals.length?"Done":vals.some(v=>v!=="Not done")?"In progress":"Not started",done,total:vals.length}});
  const need=withId(S.access).filter(a=>a.brand===bid&&!["Granted","Not Needed"].includes(a.status)).map(a=>a.platform);
  return{name:b.name,stage:onHold(b)?"On hold":b.stage,pct:Math.round(onboarding(bid)*100),groups:g,target:s.target_sign||"",signed:s.stage==="Signed",need,date:isoToday()}}
function clientHtml(m,standalone){

  return`<div class="client"><p class="ceyebrow">Onboarding status · ${esc(fmtD(m.date,true))}</p><h1>${esc(m.name)}</h1>
   <div class="cstats"><div><b>${m.pct}%</b><span>onboarding complete</span></div><div><b>${esc(m.stage||"")}</b><span>current stage</span></div><div><b>${m.signed?"Signed":m.target?esc(fmtD(m.target,true)):"To be agreed"}</b><span>${m.signed?"scope of work":"target SOW signing"}</span></div></div>

/* ---------- platform access grid: brands down, platforms across ---------- */
const ACC_MARK={"Granted":"✓","Requested":"R","In Progress":"…","Blocked":"!","Not Requested":"✗","Not Needed":"–"};
function accessGrid(){
  const rows=withId(S.access);const order=L("platform");
  const used=[...new Set(rows.filter(a=>a.status!=="Not Needed").map(a=>a.platform).filter(Boolean))]
    .sort((a,b)=>(order.indexOf(a)<0?999:order.indexOf(a))-(order.indexOf(b)<0?999:order.indexOf(b))||a.localeCompare(b));
  const cell={};for(const a of rows){const k=a.brand+"|"+a.platform;(cell[k]=cell[k]||[]).push(a)}
  let bs=brandList().filter(b=>!isInternal(b));
  const missing=bid=>rows.filter(a=>a.brand===bid&&!["Granted","Not Needed"].includes(a.status)).length;
  if(flt.accGap)bs=bs.filter(b=>missing(b.id)>0);
  bs.sort((x,y)=>(onHold(x)?1:0)-(onHold(y)?1:0));
  let h=`<p class="sub">Each row is a brand, each column a platform. Click a square to update it, or a + to add a platform the brand needs. Status only, never passwords.</p>
  <div class="legend">${L("access_status").map(v=>`<span><span class="acd ${cls(v)}">${esc(ACC_MARK[v]??"")}</span>${esc(v)}</span>`).join("")}<span><span class="acd acd-empty">+</span>Not tracked</span></div>
  <div class="filters"><div class="seg" role="group" aria-label="Show"><button data-act="accgap" data-v="0" class="${flt.accGap?"":"on"}">All brands</button><button data-act="accgap" data-v="1" class="${flt.accGap?"on":""}">Missing access only</button></div>
  ${canWrite?`<button class="btn" data-act="add-access" data-id="">Add another platform</button>`:""}</div>`;
  if(!used.length)return h+`<div class="tw"><div class="empty">No platforms tracked yet.</div></div>`;
  h+=`<div class="tw"><table class="grid acc"><thead><tr><th class="stick">Brand</th>${used.map(p=>`<th class="pc"><span>${esc(p)}</span></th>`).join("")}<th>Access</th></tr></thead><tbody>`;
  for(const b of bs){const mine=rows.filter(a=>a.brand===b.id&&a.status!=="Not Needed");const g=mine.filter(a=>a.status==="Granted").length;const bl=mine.some(a=>a.status==="Blocked");
    h+=`<tr class="${onHold(b)?"held":""}"><td class="stick"><a class="bname" href="#brand-${esc(b.id)}">${esc(b.name)}</a>${onHold(b)?` <span class="tag">On hold</span>`:""}</td>`;
    for(const p of used){const list=cell[b.id+"|"+p]||[];const a=list[0];
      if(a)h+=`<td class="gc"><button class="acd ${cls(a.status)}" data-act="open" data-kind="access" data-id="${esc(a._id)}" title="${esc(p+": "+a.status+(a.owner?" · "+a.owner:"")+(a.notes?"\n"+a.notes:""))}">${esc(ACC_MARK[a.status]??"?")}<span class="sr">${esc(p+" "+a.status)}</span></button>${list.length>1?`<span class="faint" style="font-size:11px">+${list.length-1}</span>`:""}</td>`;
      else h+=`<td class="gc">${canWrite?`<button class="acd acd-empty" data-act="acc-new" data-b="${esc(b.id)}" data-p="${esc(p)}" title="Add ${esc(p)} for ${esc(b.name)}">+<span class="sr">Add ${esc(p)}</span></button>`:`<span class="faint">·</span>`}</td>`}
    h+=`<td style="white-space:nowrap">${mine.length?(bl?pill("Blocked"):g===mine.length?pill("All Granted"):`<span class="pill s-warn">${mine.length-g} missing</span>`)+` <span class="faint">${g}/${mine.length}</span>`:`<span class="faint">None tracked</span>`}</td></tr>`}
  return h+`</tbody></table></div>`}

/* ---------- SOW progress board. Groups and columns come from config/sow_board ---------- */
function boardCols(){const cfg=S.config.sow_board;
  if(cfg&&Array.isArray(cfg.groups)&&cfg.groups.length)return cfg.groups;
  return phases().map(p=>({name:p.code+" "+p.name,cols:p.steps.map(s=>({label:s.name,steps:[s.code]}))}))}
function boardCell(bid,col){
  if(col.sow_stage){const st=(S.sow[bid]||{}).stage||"";if((col.sow_stage.done||[]).includes(st))return"Done";if((col.sow_stage.progress||[]).includes(st))return"In progress";return"Not done"}
  const vals=(col.steps||[]).filter(c=>S.steps[c]).map(c=>stepState(bid,c).status||"Not Started");
  if(!vals.length)return"";
  const live=vals.filter(v=>v!=="N/A");if(!live.length)return"N/A";
  if(live.every(v=>v==="Done"))return"Done";
  if(live.some(v=>v==="Done"||v==="In Progress"))return"In progress";
  return"Not done"}
const BOARD_MARK={"Done":"✓","In progress":"•","N/A":"–"};
const BOARD_CLS={"Done":"bd-done","In progress":"bd-prog","Not done":"bd-not","N/A":"bd-na","":"bd-na"};
function sowBoard(){
  const groups=boardCols();const bs=brandList().filter(b=>!isInternal(b));
  const rows=bs.map(b=>({b,pct:Math.round(onboarding(b.id)*100)})).sort((x,y)=>(onHold(x.b)?1:0)-(onHold(y.b)?1:0)||y.pct-x.pct||String(x.b.name).localeCompare(y.b.name));
  const ncol=groups.reduce((n,g)=>n+g.cols.length,0);
  let h=`<p class="sub">The whole onboarding journey on one screen, brand by brand. Each square rolls up one or more onboarding steps. Click a square to see and change those steps.</p>
  <div class="legend">${["Done","In progress","Not done","N/A"].map(v=>`<span><span class="bdl ${BOARD_CLS[v]}">${BOARD_MARK[v]||""}</span>${esc(v)}</span>`).join("")}</div>`+guide("sow")+`
  <div class="tw"><table class="grid board"><thead><tr><th class="stick" rowspan="2">Brand</th><th rowspan="2">SOW stage</th><th rowspan="2" class="num">Done</th>${groups.map((g,i)=>`<th colspan="${g.cols.length}" class="gh g${i%6}">${esc(g.name)}</th>`).join("")}${simple?"":`<th rowspan="2">Blocker</th>`}<th rowspan="2">Docs</th></tr>
  <tr>${groups.map((g,i)=>g.cols.map(c=>`<th class="pc g${i%6}"><span>${esc(c.label)}</span></th>`).join("")).join("")}</tr></thead><tbody>`;
  for(const{b,pct}of rows){const s=S.sow[b.id]||{};const hold=onHold(b);
    h+=`<tr class="${hold?"held":""}"><td class="stick"><a class="bname" href="#brand-${esc(b.id)}">${esc(b.name)}</a></td><td>${hold?`<span class="pill s-off">On hold</span>`:pill(s.stage||"Not Started")}</td><td class="num"><b>${pct}%</b></td>`;
    groups.forEach((g,gi)=>g.cols.forEach((c,ci)=>{const v=boardCell(b.id,c);
      h+=`<td class="gc"><button class="bd ${BOARD_CLS[v]}" data-act="board" data-b="${esc(b.id)}" data-c="${gi}.${ci}" title="${esc(c.label+": "+(v||"No steps linked"))}">${BOARD_MARK[v]||""}<span class="sr">${esc(c.label+" "+v)}</span></button></td>`}));
    h+=`${simple?"":`<td class="muted bblk"><div class="clamp2" title="${esc(s.blocker||"")}">${esc(s.blocker||"")}</div></td>`}<td style="white-space:nowrap">${s.gf_link?`<a href="${esc(s.gf_link)}" target="_blank" rel="noopener">GF</a> `:""}${s.sow_link?`<a href="${esc(s.sow_link)}" target="_blank" rel="noopener">SOW</a>`:""}${!s.gf_link&&!s.sow_link?`<span class="faint">None</span>`:""}</td></tr>`}
  if(!rows.length)h+=`<tr><td colspan="${ncol+5}"><div class="empty">No brands yet.</div></td></tr>`;
  return h+`</tbody></table></div>`}
function boardDrawerBody(bid,path){
  const [gi,ci]=String(path).split(".").map(Number);const g=boardCols()[gi];const c=g&&g.cols[ci];if(!c)return null;
  let body=`<p class="muted w" style="grid-column:1/-1;margin:0">${esc(bname(bid))} · ${esc(g.name)}</p>`;
  if(c.sow_stage){const s=S.sow[bid]||{};body+=`<div class="w" style="grid-column:1/-1"><p>Shown as Done when the SOW stage is ${esc((c.sow_stage.done||[]).join(" or "))}.</p>${statusSel("sow",bid,s.stage||"Not Started",L("sow_stage"),canEdit&&canWrite)}</div>`;return{title:c.label,body}}
  const st=(c.steps||[]).map(code=>S.steps[code]).filter(Boolean);
  if(!st.length)return{title:c.label,body:body+`<p class="w" style="grid-column:1/-1">No onboarding steps are linked to this column yet.</p>`};
  body+=`<div class="w" style="grid-column:1/-1">${st.map(s=>{const v=stepState(bid,s.code).status||"Not Started";
    return`<div class="bstep"><div><span class="code">${esc(s.code)}</span> ${esc(s.name)}${s.is_gate?` <span class="tag gate">Gate</span>`:""}${s.is_optional?` <span class="tag opt">Optional</span>`:""}</div>
    <div class="row" style="gap:6px;flex-wrap:nowrap">${statusSel("step",bid,v,L("checklist"),canWrite,`data-code="${esc(s.code)}"`)}<button class="btn sm quiet" type="button" data-act="open" data-kind="step" data-id="${esc(bid)}" data-code="${esc(s.code)}">Edit</button></div></div>`}).join("")}</div>`;
  return{title:c.label,body}}
const BPMARK={"Not Started":"","Foundations":"F","Tactics In":"T","In QA":"Q","Complete":"✓","Blocked":"!","N/A":"–"};
function vBp(){
  const secs=L("bp_section");const rows=brandList().filter(b=>S.bps[b.id]);const others=brandList().filter(b=>!S.bps[b.id]&&!isInternal(b));
  let h=`<h1>Best Practices</h1><p class="sub">Each dot is one section. Foundations, then Tactics In, then In QA, then Complete. Open a brand to change a section.</p>
  <div class="legend">${L("bp_status").map(v=>`<span><span class="bpd bp-${key(v)}">${esc(BPMARK[v]??"")}</span>${esc(v)}</span>`).join("")}</div>`;
  if(canWrite&&others.length)h+=`<div class="filters"><select data-act="bp-add" aria-label="Start tracking a brand"><option value="">Start tracking a brand...</option>${others.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("")}</select></div>`;
  if(!rows.length)return h+`<div class="tw"><div class="empty">No brands tracked yet. Pick one above to start.</div></div>`;
  h+=`<div class="tw"><table><thead><tr><th>Brand</th>${secs.map(x=>`<th title="${esc(x)}" style="white-space:normal;min-width:64px">${esc(x)}</th>`).join("")}<th>Progress</th><th>Overall</th>${simple?"":"<th>Owner</th><th>Due</th>"}</tr></thead><tbody>`;
  const ord={Blocked:0,"In Progress":1,"In QA":2,"Not Started":3,Complete:4};
  rows.sort((a,b)=>(ord[bpRoll(a.id).overall]??5)-(ord[bpRoll(b.id).overall]??5));
  for(const b of rows){const d=S.bps[b.id];const r=bpRoll(b.id);
    h+=`<tr class="click" data-act="open" data-kind="bp" data-id="${esc(b.id)}"><td><a class="bname" href="#brand-${esc(b.id)}">${esc(b.name)}</a></td>${secs.map(x=>{const v=(d.sections||{})[x]||"Not Started";return`<td><span class="bpd bp-${key(v)}" title="${esc(x+": "+v)}">${esc(BPMARK[v]??"")}</span><span class="sr">${esc(v)}</span></td>`}).join("")}
    <td>${r.done}/${r.total}</td><td>${pill(r.overall)}</td>${simple?"":`<td>${esc(d.owner)}</td><td>${dueHtml(d.due_date,r.progress===1)}</td>`}</tr>`}
  return h+`</tbody></table></div>`}

  return h}

function closeDrawer(){drawerCtx=null;$("#drawer").hidden=true;$("#scrim").hidden=true}
const splitNames=v=>String(v||"").split(",").map(s=>s.trim()).filter(Boolean);
async function drawerSave(){
  const{kind,id,extra}=drawerCtx;const fd={};for(const el of $("#dform").elements)if(el.name)fd[el.name]=el.value.trim();
  const diff=(cur,next)=>{const p={};for(const k of Object.keys(next)){if(JSON.stringify(cur[k]??"")!==JSON.stringify(next[k]??""))p[k]=next[k]}return p};
  if(kind==="task"){const t=S.tasks[id];const next={title:fd.title,brand:fd.brand,department:fd.department,vertical:fd.vertical||"",owner:fd.owner,status:fd.status,priority:fd.priority,deadline:fd.deadline,notes:fd.notes};
    if(!simple)Object.assign(next,{start:fd.start,support:splitNames(fd.support),brief_link:fd.brief_link,creative_link:fd.creative_link});
    if(!next.title){toast("Give the task a name.");return}
    if(next.status==="Blocked"){const text=fd.blk_text!==undefined?fd.blk_text:(t.blocker&&t.blocker.text);const person=fd.blk_person!==undefined?fd.blk_person:(t.blocker&&t.blocker.person);
      if(!text||!person){if(t.status!=="Blocked"){closeDrawer();askBlocker(r=>save("tasks",id,Object.assign(diff(t,next),{status:"Blocked",blocker:r}),t.title));return}toast("A blocker needs one line and a person.");return}
      next.blocker={text,person}}else next.blocker=null;
    const p=diff(t,next);if(Object.keys(p).length)await save("tasks",id,p,t.title)}
  else if(kind==="brand"){const b=S.brands[id];const next={name:fd.name,stage:fd.stage,lead:fd.lead,founder:fd.founder,website:fd.website,sprint_label:fd.sprint_label,next_step:fd.next_step,paused:fd.paused==="Yes",restricted:fd.restricted==="Yes"};
    if(!next.name){toast("A brand needs a name.");return}const p=diff(b,next);if(Object.keys(p).length)await save("brands",id,p,b.name)}
  else if(kind==="step"){const st=stepState(id,extra);
    if(fd.status==="Done"&&st.status!=="Done"){const why=gateBlock(id,extra);if(why){toast(why);return}}
    if(fd.blk_text&&!fd.blk_person){toast("A blocker needs a person too.");return}
    const next={status:fd.status,owner:fd.owner,deadline:fd.deadline,link:fd.link,notes:fd.notes,blocker:fd.blk_text?{text:fd.blk_text,person:fd.blk_person}:null};
    await saveStep(id,extra,next)}
  else if(kind==="access"){const a=S.access[id];const next={platform:fd.platform,status:fd.status,access_level:fd.access_level,needed_for:fd.needed_for,owner:fd.owner,brand_contact:fd.brand_contact,requested_date:fd.requested_date,deadline:fd.deadline,blocker:fd.blocker,notes:fd.notes};
    if(next.status==="Blocked"&&(!next.blocker||!next.owner)){toast("A blocked row needs a blocker and a Valerie owner.");return}
    const p=diff(a,next);if(Object.keys(p).length)await save("access",id,p,bname(a.brand)+" "+a.platform)}
  else if(kind==="sow"){const s=S.sow[id]||{};const next={stage:fd.stage,owner:fd.owner,target_sign:fd.target_sign,draft_due:fd.draft_due,start_date:fd.start_date,batch:fd.batch,support:splitNames(fd.support),sow_link:fd.sow_link,gf_link:fd.gf_link,gf_updated:fd.gf_updated==="Yes",gf_status:fd.gf_status||"",blocker:fd.blocker,next_step:fd.next_step};
    if(next.stage==="Blocked"&&!next.blocker){toast("Say what blocks the SOW.");return}
    if(!S.sow[id]){await create("sow",id,Object.assign({brand:id},next),"SOW "+bname(id))}else{const p=diff(s,next);if(Object.keys(p).length)await save("sow",id,p,"SOW "+bname(id))}}
  else if(kind==="bp"){const d=S.bps[id];const sections=Object.assign({},d.sections||{});for(const x of L("bp_section"))if(fd["sec:"+x])sections[x]=fd["sec:"+x];
    const next={sections,owner:fd.owner,due_date:fd.due_date,blocker:fd.blocker,doc_link:fd.doc_link,notes:fd.notes};const p=diff(d,next);if(Object.keys(p).length)await save("bps",id,p,"BPs "+bname(id))}
  closeDrawer()}
function gateBlock(bid,code){const s=S.steps[code];if(!s||!s.is_gate)return"";const open=stepsSorted().filter(x=>x.order<s.order&&!x.is_optional&&!["Done","N/A"].includes(stepState(bid,x.code).status));
  return open.length?`${s.code} is a gate. Finish ${open.length} earlier step${open.length>1?"s":""} first: ${open.slice(0,4).map(x=>x.code).join(", ")}${open.length>4?"...":""}`:""}
async function saveStep(bid,code,next){
  if(!db||!canWrite){toast("You can view this tracker but not change it.");return}
  const had=!!S.bsteps[bid];const doc=S.bsteps[bid]||{brand:bid,s:{}};const cur=(doc.s||{})[code]||{};
  if(S.steps[code]&&S.steps[code].is_gate&&next.status==="Done"&&cur.status!=="Done")next=Object.assign({},next,{approved_by:me||"",approved_at:isoToday()});
  if(next.status&&next.status!=="Done"&&cur.approved_by)next=Object.assign({},next,{approved_by:"",approved_at:""});
  const merged=Object.assign({},cur,next);
  const p={};for(const k of Object.keys(next))if(JSON.stringify(cur[k]??"")!==JSON.stringify(next[k]??""))p[k]=next[k];if(!Object.keys(p).length)return;
  const old={};for(const k of Object.keys(p))old[k]=cur[k];
  S.bsteps[bid]=Object.assign({},doc,{s:Object.assign({},doc.s||{},{[code]:merged})});render();
  return chain("bs/"+bid,()=>had?db.doc("brand_steps/"+bid).update({s:{[code]:merged},updated_at:Date.now()}):db.doc("brand_steps/"+bid).set({brand:bid,s:{[code]:merged},updated_at:Date.now()}))
   .then(()=>{toast("Saved");addLog("bsteps",bid,p,old,bname(bid)+" "+code)}).catch(e=>{if(!refused(e))toast("Not saved. Try again.");S.bsteps[bid]=doc;render()})}

  else if(act==="allphases"){showAllPhases=!showAllPhases;render()}
  else if(act==="settab"){setTab=a.dataset.tab;render()}
  else if(act==="close")closeDrawer();
  else if(act==="mclose")$("#modal").hidden=true;
  else if(act==="dsave")drawerSave();
  else if(act==="del"){const{kind,id}=a.dataset;confirmBox("Delete this row? This cannot be undone.","Delete",()=>{closeDrawer();remove(kind==="task"?"tasks":"access",id,kind)})}
  else if(act==="add-task"){const bid=a.dataset.id,dep0=a.dataset.dep||"";formBox("New task",`<div class="f"><label for="n-title">Task</label><input id="n-title" name="title" required></div><div class="f"><label for="n-dep">Team</label><select id="n-dep" name="department">${opts(DEPTS(),dep0||DEPTS()[0],false)}</select></div><div class="f"><label for="n-owner">Owner</label><select id="n-owner" name="owner">${opts(activePeople(),me)}</select></div><div class="f"><label for="n-dl">Deadline</label><input id="n-dl" name="deadline" type="date"></div><div class="f"><label for="n-pr">Priority</label><select id="n-pr" name="priority">${opts(L("priority"),"Medium")}</select></div>`,"Add task",
    v=>{if(!v.title){toast("Give the task a name.");return false}create("tasks",null,{brand:bid,department:v.department,title:v.title,owner:v.owner,support:[],status:"Not Started",priority:v.priority,start:"",deadline:v.deadline,notes:"",brief_link:"",creative_link:"",blocker:null,source:"Added in tracker"},v.title)})}
  else if(act==="add-access"){const bid=a.dataset.id;formBox("New platform access row",`<div class="f"><label for="n-b">Brand</label><select id="n-b" name="brand">${brandList().map(b=>`<option value="${esc(b.id)}" ${b.id===bid?"selected":""}>${esc(b.name)}</option>`).join("")}</select></div><div class="f"><label for="n-p">Platform</label><select id="n-p" name="platform">${opts(L("platform"),"")}</select></div><div class="f"><label for="n-o">Valerie owner</label><select id="n-o" name="owner">${opts(activePeople(),"")}</select></div>`,"Add row",
    v=>{if(!v.platform){toast("Pick a platform.");return false}create("access",null,{brand:v.brand,platform:v.platform,access_level:"TBC",needed_for:"",owner:v.owner,brand_contact:(S.brands[v.brand]||{}).founder||"",requested_date:"",deadline:"",status:"Not Requested",blocker:"",notes:""},bname(v.brand)+" "+v.platform)})}
  else if(act==="add-sow"){const bid=a.dataset.id;create("sow",bid,{brand:bid,owner:"",support:[],stage:"Not Started",start_date:"",draft_due:"",target_sign:"",blocker:"",next_step:"",sow_link:"",gf_link:"",gf_updated:false,gf_status:"",batch:""},"SOW "+bname(bid))}
  else if(act==="add-bp"){const bid=a.dataset.id;create("bps",bid,{brand:bid,owner:"",due_date:"",sections:{},blocker:"",doc_link:"",notes:""},"BPs "+bname(bid))}
  else if(act==="add-brand"){formBox("Add brand",`<div class="f"><label for="n-name">Brand name</label><input id="n-name" name="name" required></div><div class="f"><label for="n-st">Stage</label><select id="n-st" name="stage">${opts(L("stage"),"Qualification",false)}</select></div>`,"Add brand",
    v=>{if(!v.name){toast("Type the brand name.");return false}let id=v.name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"brand";while(S.brands[id])id+="-2";
      create("brands",id,{name:v.name,founder:"",website:"",stage:v.stage,lead:"",next_step:"",sprint_label:"",order:brandList().length+1,paused:false,restricted:false},v.name);
      db.doc("brand_steps/"+id).set({brand:id,s:{}}).catch(()=>{});if(v.stage!=="Internal")db.doc("sow/"+id).set({brand:id,owner:"",support:[],stage:"Not Started",start_date:"",draft_due:"",target_sign:"",blocker:"",next_step:"",sow_link:"",gf_link:"",gf_updated:false,gf_status:"",batch:""}).catch(()=>{});
      go("brand-"+id)})}
  else if(act==="phase-done"){const bid=a.dataset.id,pc=a.dataset.phase;const p=phases().find(x=>x.code===pc);const first=p.steps[0];
    const earlier=stepsSorted().filter(x=>x.order<first.order&&!x.is_optional&&!["Done","N/A"].includes(stepState(bid,x.code).status));
    if(earlier.length){toast(`Finish the ${earlier.length} open step${earlier.length>1?"s":""} in earlier phases first.`);return}
    confirmBox(`Mark every step in ${pc} done for ${bname(bid)}?`,"Mark done",async()=>{for(const s of p.steps){const st=stepState(bid,s.code).status;if(st!=="Done"&&st!=="N/A")await saveStep(bid,s.code,{status:"Done"})}})}
  else if(act==="add-person"){formBox("Add person",`<div class="f"><label for="n-pn">Name as people write it</label><input id="n-pn" name="name" required></div><div class="f"><label for="n-pk">Type</label><select id="n-pk" name="kind">${opts(["team","external","group"],"team",false)}</select></div>`,"Add",
    v=>{if(!v.name){toast("Type a name.");return false}if(people().some(p=>p.name.toLowerCase()===v.name.toLowerCase())){toast("That name is already in the list.");return false}savePeople(people().concat([{name:v.name,kind:v.kind,aliases:[],active:true}]),"Added "+v.name)})}
  else if(act==="save-lists"){const next=Object.assign({},S.config.lists);document.querySelectorAll("[data-list]").forEach(t=>{next[t.dataset.list]=t.value.split("\n").map(s=>s.trim()).filter(Boolean)});
    save("config","lists",next,"Lists")}
  else if(act==="export-xlsx")exportXlsx();
  else if(act==="export-json")exportJson();
});
document.addEventListener("change",e=>{
  const t=e.target;const act=t.dataset&&t.dataset.act;if(!act)return;
  if(act==="who"){me=t.value;ls.set("vt-me",me);if(db&&uid)db.doc("data/users/"+uid+"/profile").set({person:me}).catch(()=>{});render();return}
  if(act==="status"){const kind=t.dataset.kind,id=t.dataset.id,v=t.value;
    if(kind==="task"){const cur=S.tasks[id];if(v==="Blocked"){t.value=cur.status;askBlocker(r=>save("tasks",id,{status:"Blocked",blocker:r},cur.title));return}
      save("tasks",id,{status:v,blocker:null},cur.title)}
    else if(kind==="step"){const code=t.dataset.code;if(v==="Done"){const why=gateBlock(id,code);if(why){t.value=stepState(id,code).status||"Not Started";toast(why);return}}saveStep(id,code,{status:v})}
    else if(kind==="access"){const cur=S.access[id];if(v==="Blocked"&&!cur.blocker){t.value=cur.status;askBlocker(r=>save("access",id,{status:"Blocked",blocker:r.text,owner:cur.owner||r.person},bname(cur.brand)+" "+cur.platform));return}save("access",id,{status:v},bname(cur.brand)+" "+cur.platform)}
    else if(kind==="sow"){const cur=S.sow[id]||{};if(v==="Blocked"&&!cur.blocker){t.value=cur.stage||"Not Started";askBlocker(r=>save("sow",id,{stage:"Blocked",blocker:r.text+" (waiting on "+r.person+")"},"SOW "+bname(id)));return}
      if(!S.sow[id])create("sow",id,{brand:id,stage:v},"SOW "+bname(id));else save("sow",id,{stage:v},"SOW "+bname(id))}
    return}
  if(act==="bpsec"){const id=t.dataset.id;const d=S.bps[id];save("bps",id,{sections:Object.assign({},d.sections||{},{[t.dataset.sec]:t.value})},"BPs "+bname(id));return}
  if(act==="fa"){flt[t.dataset.k]=t.value;render();return}
  if(act==="mgroup"){mineGroup[mineTab]=t.value;ls.set("vt-mgroup",JSON.stringify(mineGroup));render();return}
  if(act==="msort"){mineSort=t.value;ls.set("vt-msort",mineSort);render();return}
  if(act==="mvertsel"){mineVert=t.value;render();return}
  if(act==="pf"){if(t.dataset.k==="vert")peopleVert=t.value;else peopleDept=t.value;render();return}
  if(act==="use-tpl"&&t.value!==""){const tp=TEMPLATES()[+t.value];const bid=t.dataset.id;t.value="";if(!tp)return;
    confirmBox(`Add ${tp.tasks.length} tasks from "${tp.name}" to ${bname(bid)}?`,"Add tasks",async()=>{for(const x of tp.tasks){const d=new Date(today());d.setDate(d.getDate()+(x.days||0));
      await create("tasks",null,{brand:bid,title:x.title,owner:"",support:[],status:"Not Started",priority:"",start:isoToday(),deadline:x.days?d.toISOString().slice(0,10):"",notes:"From template: "+tp.name,brief_link:"",creative_link:"",blocker:null,department:x.department||"",department_auto:!x.department,vertical:tp.vertical||"",source:"Template: "+tp.name},bname(bid)+" "+x.title)}toast("Added "+tp.tasks.length+" tasks")});return}
  if(act==="bp-add"&&t.value){const id=t.value;create("bps",id,{brand:id,owner:"",due_date:"",sections:{},blocker:"",doc_link:"",notes:""},"BPs "+bname(id));return}
  if(act==="setbrand"&&t.value){save("tasks",t.dataset.id,{brand:t.value},S.tasks[t.dataset.id].title);return}
  if(act==="person"){const ps=people().map(p=>Object.assign({},p));const p=ps[+t.dataset.i];const f=t.dataset.f;
    if(f==="active")p.active=t.checked;else if(f==="leadership")p.leadership=t.checked;else if(f==="aliases")p.aliases=splitNames(t.value);else p[f]=t.value;savePeople(ps,p.name);return}
  if(act==="stepdef"){const id=t.dataset.id,f=t.dataset.f;const v=t.type==="checkbox"?t.checked:t.value.trim();if(f==="name"&&!v){toast("A step needs a name.");return}save("steps",id,{[f]:v},"Step "+id);return}
});
function savePeople(ps,label){save("config","people",{people:ps},"People: "+label)}
function saveTemplates(list){if(S.config.templates)save("config","templates",{list},"Task templates");else create("config","templates",{list},"Task templates")}
document.addEventListener("submit",e=>{const f=e.target;
  if(f.id==="cform"){e.preventDefault();const text=f.elements.text.value.trim(),bid=f.elements.brand.value;if(!text)return;
    if(!me){toast("Pick your name in the top bar first, so people know who wrote it.");return}
    create("comments",null,{brand:bid,text,by:me,at:Date.now(),mentions:mentionsIn(text)},"Comment on "+bname(bid)).then(id=>{if(id)f.reset()})}
  if(f.id==="tform"){e.preventDefault();const name=f.elements.name.value.trim(),tasks=parseTemplateLines(f.elements.lines.value);
    if(!name||!tasks.length){toast("Give the template a name and at least one task.");return}saveTemplates(TEMPLATES().concat([{name,vertical:f.elements.vertical.value,tasks}]))}});
document.addEventListener("input",e=>{if(e.target.id==="q"){searchQ=e.target.value;renderSearch()}});
document.addEventListener("focusout",e=>{if(e.target.id==="q")setTimeout(()=>{if(!$(".search")||!$(".search").contains(document.activeElement)){const b=$("#sres");if(b)b.hidden=true;renderTop()}},150)});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"")){const q=$("#q");if(q){e.preventDefault();q.focus()}}
  if(e.target.id==="q"&&e.key==="Enter"){const first=$("#sres .sr-row");if(first)first.click()}

$("#scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#modal").hidden)$("#modal").hidden=true;else closeDrawer()}});

function loadXlsx(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s)})}
async function offer(filename,data){if(!dl){toast("Downloads are not available in this view.");return}try{await dl.save({filename,data});toast("Downloaded")}catch(e){if(e&&e.code!=="declined")toast("The download did not finish.")}}
async function exportXlsx(){
  let X;try{X=await loadXlsx()}catch(e){toast("Could not load the Excel library. Try again.");return}
  const wb=X.utils.book_new();const add=(name,rows)=>X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(rows),name.replace(/[\\\/?*\[\]:]/g,"").slice(0,31));
  const bs=brandList();
  add("Brand Tracker",[["Brand","Founder","Website","Stage","Brand Lead","Open Tasks","Blocked Tasks","Overdue Tasks","Platform Access","Access Granted","SOW Stage","SOW Owner","SOW Target Sign","BPs","BP Progress","Onboarding %","Health","Next Step"]]
    .concat(bs.map(b=>{const r=roll(b.id);return[b.name,b.founder,b.website,b.stage,b.lead,r.open,r.blocked,r.overdue,r.acc.summary,r.acc.text,r.sow,r.sowRow.owner||"",r.sowRow.target_sign||"",r.bp?r.bp.overall:"",r.bp?Math.round(r.bp.progress*100)/100:"",Math.round(r.pct*100)/100,r.health,b.next_step]})));
  for(const b of bs){const ts=withId(S.tasks).filter(t=>t.brand===b.id);add(b.name,[["Task / Deliverable","Owner","Support Team","Status","Priority","Start Date","Deadline","Due Flag","Notes / Next Step","Brief Link","Creative Link"]]
    .concat(ts.map(t=>[t.title,t.owner,(t.support||[]).join(", "),t.status,t.priority,t.start,t.deadline,dueFlag(t.deadline,t.status==="Complete"),t.notes,t.brief_link,t.creative_link])))}
  add("Platform Access",[["Brand","Platform","Access Level","Needed For","Valerie Owner","Brand Contact","Requested Date","Deadline","Status","Days Waiting","Due Flag","Blocker","Notes"]].concat(withId(S.access).map(a=>{const d=parseD(a.requested_date);return[bname(a.brand),a.platform,a.access_level,a.needed_for,a.owner,a.brand_contact,a.requested_date,a.deadline,a.status,d&&!["Granted","Not Needed"].includes(a.status)?Math.round((today()-d)/864e5):"",dueFlag(a.deadline,["Granted","Not Needed"].includes(a.status)),a.blocker,a.notes]})));
  add("SOW Tracker",[["Brand","SOW Owner","Support Team","SOW Stage","Start Date","Draft Due","Target Sign Date","Due Flag","Blocker / Dependency","Next Step","SOW Link","GF Link","Updated GF?","Batch","GF Status"]].concat(bs.filter(b=>S.sow[b.id]).map(b=>{const s=S.sow[b.id];return[b.name,s.owner,(s.support||[]).join(", "),s.stage,s.start_date,s.draft_due,s.target_sign,sowDue(s),s.blocker,s.next_step,s.sow_link,s.gf_link,s.gf_updated?"yes":"",s.batch,s.gf_status||""]})));
  const secs=L("bp_section");add("BP Tracker",[["Brand","BP Owner","Due Date","Due Flag"].concat(secs,["Progress","Overall","Blocker","BP Doc Link","Notes"])].concat(bs.filter(b=>S.bps[b.id]).map(b=>{const d=S.bps[b.id],r=bpRoll(b.id);return[b.name,d.owner,d.due_date,r.due].concat(secs.map(x=>(d.sections||{})[x]||""),[Math.round(r.progress*100)/100,r.overall,d.blocker,d.doc_link,d.notes])})));
  const st=stepsSorted();add("Onboarding Steps",[["Phase","Code","Step"].concat(bs.map(b=>b.name))].concat([["","","% Complete"].concat(bs.map(b=>Math.round(onboarding(b.id)*100)/100))],st.map(s=>[s.phase+" "+s.phase_name,s.code,s.name].concat(bs.map(b=>stepState(b.id,s.code).status||"")))));
  add("Completed Archive",[["Brand","Task / Deliverable","Owner","Support Team","Start Date","Deadline","Notes"]].concat(withId(S.tasks).filter(t=>!t.brand).map(t=>["",t.title,t.owner,(t.support||[]).join(", "),t.start,t.deadline,t.notes])));
  const lk=["task_status","priority","stage","platform","access_level","access_status","sow_stage","checklist","bp_section","bp_status"];const heads=["Task Status","Priority","Stage","Team","Platform","Access Level","Access Status","SOW Stage","Checklist","BP Section","BP Status"];
  const cols=[L("task_status"),L("priority"),L("stage"),activePeople()].concat(lk.slice(3).map(L));const n=Math.max(...cols.map(c=>c.length));const rows=[heads];for(let i=0;i<n;i++)rows.push(cols.map(c=>c[i]||""));add("Lists",rows);
  const out=X.write(wb,{bookType:"xlsx",type:"array"});
  await offer("Valerie_COE_Tracker_"+isoToday()+".xlsx",new Blob([out]))}
async function exportJson(){const dump={exported_at:new Date().toISOString()};for(const[k,c]of Object.entries(COLL))dump[c]=S[k];await offer("Valerie_COE_backup_"+isoToday()+".json",JSON.stringify(dump,null,1))}

parseHash();
(async()=>{
  if(typeof window.claude==="undefined"||!window.claude.use){$("#main").innerHTML=`<h1>Open this tracker from its claude.ai link</h1><p class="sub">The live team data is stored with the claude.ai page. Ask the owner for the link.</p>`;return}
  db=await claude.use("db");
  if(!db){$("#main").innerHTML=`<h1>Tracker unavailable here</h1><p class="sub">Open the page from claude.ai while signed in to your Valerie account.</p>`;return}
  U=await claude.use("user");dl=await claude.use("downloads");
  if(U){try{uid=await U.id()}catch(e){}try{canEdit=!!(await U.canEdit())}catch(e){}try{const w=await U.can("data.write");if(w===false)canWrite=false}catch(e){}}
  if(simple===null)simple=!canEdit;
  if(uid){try{const p=await db.doc("data/users/"+uid+"/profile").get();if(p.exists&&p.data().person)me=p.data().person}catch(e){}}
  const sub=(k,c)=>db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=Object.assign({},d.data())});S[k]=o;ready[k]=true;epoch++;
    if(k==="config"&&!me&&U){U.me().then(v=>{if(!me&&v&&v.name){const first=v.name.split(" ")[0].toLowerCase();const hit=activePeople().find(p=>p.toLowerCase()===first);if(hit){me=hit;render()}}}).catch(()=>{})}
    scheduleRender()},err=>{if(err&&err.code!=="revoked")toast("Live updates paused. Reload the page.")});
  for(const[k,c]of Object.entries(COLL))sub(k,c);
  db.collection("log").orderBy("date","desc").limit(30).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});S.log=o;if(route.v==="settings")render()},()=>{});
})();
})();
