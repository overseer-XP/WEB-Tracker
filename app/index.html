<title>VALFLO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* fixed colours used by components (brand navy, white, founder view, hero): one place to change them */
:root{--c-000000:#000000;--c-0a5bd8:#0A5BD8;--c-0b1033:#0B1033;--c-0e1438:#0E1438;--c-141b4d:#141B4D;--c-1b1f3b:#1B1F3B;--c-2c3157:#2C3157;--c-2f3561:#2F3561;--c-3a7454:#3A7454;--c-4a5375:#4A5375;--c-545c7c:#545C7C;--c-59607a:#59607A;--c-6ead86:#6EAD86;--c-796d8f:#796D8F;--c-7fa6ee:#7FA6EE;--c-856325:#856325;--c-86d9a6:#86D9A6;--c-86d9ff:#86D9FF;--c-8db89b:#8DB89B;--c-8fb0e8:#8FB0E8;--c-93c1af:#93C1AF;--c-9aa3be:#9AA3BE;--c-9da2c4:#9DA2C4;--c-9f4e48:#9F4E48;--c-a9aecb:#A9AECB;--c-a9d0b6:#A9D0B6;--c-aeb8d6:#AEB8D6;--c-b5470b:#B5470B;--c-b5a4d5:#B5A4D5;--c-c7b88a:#C7B88A;--c-c7d8f7:#C7D8F7;--c-c9cde2:#C9CDE2;--c-c9d2e8:#C9D2E8;--c-cdd3e3:#CDD3E3;--c-d6a44c:#D6A44C;--c-d99a1e:#D99A1E;--c-d99bb5:#D99BB5;--c-e2e6f0:#E2E6F0;--c-e2f0e7:#E2F0E7;--c-e6e8f2:#E6E8F2;--c-e6ebf4:#E6EBF4;--c-e7eaf2:#E7EAF2;--c-e8a87a:#E8A87A;--c-ea9f44:#EA9F44;--c-eceff6:#ECEFF6;--c-eef1f8:#EEF1F8;--c-f07a28:#F07A28;--c-f2c26b:#F2C26B;--c-f3b98c:#F3B98C;--c-f4a39b:#F4A39B;--c-f4e2df:#F4E2DF;--c-f4f6fb:#F4F6FB;--c-f6e2df:#F6E2DF;--c-f7edd8:#F7EDD8;--c-faf8f4:#FAF8F4;--c-fdebdd:#FDEBDD;--navy-950:#050A2E;--white:#FFFFFF}

/* Calm palette: misty sage-grey ground, soft teal accent, pastel status fills. Layout: left rail, top bar with search and Simple / Full, work area, edit drawer */
:root{color-scheme:light;--shadow:none;
  --bg:var(--c-f4f6fb); --panel:var(--white); --panel2:var(--c-eef1f8); --ink:var(--c-0b1033); --muted:var(--c-4a5375); --faint:var(--c-545c7c); --line:var(--c-e2e6f0); --line2:var(--c-cdd3e3);
  --rail:var(--navy-950); --railHover:var(--c-141b4d); --accent:var(--c-0a5bd8); --accentInk:var(--white); --accentSoft:var(--soft);
  --ok:var(--c-3a7454); --okBg:var(--c-e2f0e7); --warn:var(--c-856325); --warnBg:var(--c-f7edd8); --bad:var(--c-9f4e48); --badBg:var(--c-f6e2df);
  --info:var(--c-0a5bd8); --infoBg:var(--soft); --off:var(--c-59607a); --offBg:var(--c-eceff6);
  --fDone:var(--c-a9d0b6); --fProg:var(--c-c7d8f7); --fNot:var(--c-f4e2df); --fNA:var(--c-e7eaf2);
  --dLive:var(--c-6ead86); --dRisk:var(--c-d6a44c); --dTrack:var(--c-7fa6ee);
  --g0:var(--c-8db89b); --g1:var(--c-8fb0e8); --g2:var(--c-b5a4d5); --g3:var(--c-e8a87a); --g4:var(--c-93c1af); --g5:var(--c-c7b88a); --g6:var(--c-d99bb5);
  --ember:var(--c-f07a28); --emberInk:var(--c-b5470b); --emberBg:var(--c-fdebdd); --mid:var(--navy-950);
  --f-ui:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-code:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --navy:var(--navy-950); --amber:var(--c-ea9f44);
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E17; --panel:#131722; --panel2:#1A1F2D; --ink:#ECEEF4; --muted:#A4ABBD; --faint:#959CB0; --line:#252B3A; --line2:#363D50;
  --rail:#060A1F; --railHover:#141B3D; --accent:#6EA2FF; --accentInk:#0B0E17; --accentSoft:#1B2540;
  --ok:#8CC6A1; --okBg:#173326; --warn:#E0BF7E; --warnBg:#3A2D12; --bad:#E3A09A; --badBg:#3D1C1B;
  --info:#8DB4FF; --infoBg:#1B2540; --off:#A4ABBD; --offBg:#1E2331;
  --fDone:#2F5A43; --fProg:#26406E; --fNot:#3E2A29; --fNA:#1E2331;
  --dLive:#7BBE95; --dRisk:#D9AE5E; --dTrack:#7EAAFF;
  --g0:#5E8A6D; --g1:#4A6FB3; --g2:#7F70A3; --g3:#B07A50; --g4:#5F9483; --g5:#978A5F; --g6:#A86A86;
  --ember:#F59A52; --emberInk:#F59A52; --emberBg:#33200F; --mid:#050A2E; color-scheme:dark; --shadow:none}}
:root[data-theme="dark"]{
  --bg:#0B0E17; --panel:#131722; --panel2:#1A1F2D; --ink:#ECEEF4; --muted:#A4ABBD; --faint:#959CB0; --line:#252B3A; --line2:#363D50;
  --rail:#060A1F; --railHover:#141B3D; --accent:#6EA2FF; --accentInk:#0B0E17; --accentSoft:#1B2540;
  --ok:#8CC6A1; --okBg:#173326; --warn:#E0BF7E; --warnBg:#3A2D12; --bad:#E3A09A; --badBg:#3D1C1B;
  --info:#8DB4FF; --infoBg:#1B2540; --off:#A4ABBD; --offBg:#1E2331;
  --fDone:#2F5A43; --fProg:#26406E; --fNot:#3E2A29; --fNA:#1E2331;
  --dLive:#7BBE95; --dRisk:#D9AE5E; --dTrack:#7EAAFF;
  --g0:#5E8A6D; --g1:#4A6FB3; --g2:#7F70A3; --g3:#B07A50; --g4:#5F9483; --g5:#978A5F; --g6:#A86A86;
  --ember:#F59A52; --emberInk:#F59A52; --emberBg:#33200F; --mid:#050A2E; color-scheme:dark; --shadow:none}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);font-variant-numeric:tabular-nums}
h1,h2,h3,h4,.sech,.bh1,.btbig{font-family:var(--f-head);font-weight:600;letter-spacing:-.015em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
a.bname,.hyg a{display:inline-block;min-height:24px;line-height:24px}
select,input:not([type=checkbox]):not([type=radio]):not([type=hidden]){min-height:24px}select.ps{min-height:24px}
input[type=checkbox],input[type=radio]{width:24px;height:24px;margin:0 4px 0 0;vertical-align:middle;accent-color:var(--accent)}
main h1[tabindex="-1"]:focus{outline:none}
.mtabs .mt{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--panel);color:var(--accent);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-weight:700;border:2px solid var(--accent)}.skip:focus{left:8px}
input,select,textarea{background-color:var(--panel);color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;overflow:hidden}
.app>*{min-height:0}
/* rail */
.rail{position:relative;background-color:var(--navy-950);background-image:radial-gradient(rgb(255 255 255/.06) 1px,transparent 1.2px),radial-gradient(circle at 15% 105%,rgb(10 91 216/.55),transparent 55%);background-size:16px 16px,100% 100%;background-attachment:local,local;color:var(--c-e6e8f2);border-right:1px solid var(--c-1b1f3b);overflow-y:auto;padding:22px 14px 20px;display:flex;flex-direction:column;gap:6px;
  --ok:var(--c-86d9a6);--warn:var(--c-f2c26b);--bad:var(--c-f4a39b);--faint:var(--c-9da2c4);--off:var(--c-9da2c4);--muted:var(--c-a9aecb);--ink:var(--c-e6e8f2);scrollbar-width:thin;scrollbar-color:var(--c-2c3157) transparent}
:root[data-theme="dark"] .rail{background-color:#040820}
.mark{display:flex;align-items:center;gap:12px;padding:2px 10px 18px;color:var(--white);text-decoration:none}
.mark .logo{width:30px;height:auto;fill:var(--amber);flex:none}
.mark .mk{font-family:var(--f-head);font-weight:600;font-size:24px;letter-spacing:.02em;line-height:1}
.mark small{display:none}
.rsec{font-size:12px;font-weight:500;color:var(--c-9da2c4);text-transform:uppercase;letter-spacing:.12em;margin:16px 12px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.blink,.rsub a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--c-c9cde2);text-decoration:none;min-height:38px;font-size:14px;border:1px solid transparent}
.nav a:hover,.blink:hover,.rsub a:hover,.rgh button:hover{background:rgb(255 255 255/.05);color:var(--white)}
.nav a.on,.blink.on,.rsub a.on{background:rgb(255 255 255/.10);border-color:rgb(255 255 255/.14);color:var(--white);font-weight:500;box-shadow:inset 3px 0 0 var(--ember)}
.nav a:focus-visible,.blink:focus-visible,.rsub a:focus-visible,.rgh button:focus-visible,.mark:focus-visible{outline:2px solid var(--c-86d9ff);outline-offset:1px}
.ni{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nav .n,.blink .n,.rgh .n{margin-left:auto;font-size:13px;color:var(--c-a9aecb)}
.rgh{margin:2px 0 0}.rgh button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--c-e6e8f2);min-height:38px}
.rgh .n{margin-left:auto}
.chev{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;transition:transform .15s;opacity:.8;order:3;margin-left:6px}
.rgh button[aria-expanded=true] .chev{transform:rotate(-90deg)}.rgh button[aria-expanded=false] .chev{transform:rotate(90deg)}
.blink{font-size:14px;margin-left:14px}.blink .chev{margin-left:4px;width:12px;height:12px;opacity:.6}.blink[aria-expanded=true] .chev{transform:rotate(-90deg)}.blink[aria-expanded=false] .chev{transform:rotate(90deg)}
.rsub .n{margin-left:auto;font-size:12px;color:var(--c-a9aecb);white-space:nowrap}.rsub a.on .n{color:var(--c-e6e8f2)}.rsub .sig.sm{margin-right:-4px}.rsub .nl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blink .tag{margin-left:4px;background:rgb(255 255 255/.10);color:var(--c-e6e8f2)}
.rsub{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 30px;padding-left:10px;border-left:1px solid var(--c-2c3157)}.rsub a{font-size:14px;min-height:34px;padding:6px 10px}
.addbtn{margin-top:auto;border:1px solid var(--c-2f3561);background:rgb(255 255 255/.04);border-radius:12px;padding:12px;cursor:pointer;color:var(--c-e6e8f2);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.addbtn:hover{background:rgb(255 255 255/.08);color:var(--white)}
/* health dot */
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--off);display:inline-block}
.dot.h-Live,.dot.h-OnTrack{background:var(--ok)}
.dot.h-AtRisk,.dot.h-Hasblockers,.dot.h-HasBlockers{background:var(--warn);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);width:11px;height:10px}
.dot.h-Blocked{background:var(--bad);border-radius:6px}
.dot.h-OnHold{background:transparent;box-shadow:inset 0 0 0 2px var(--faint)}
/* top */
.mainwrap{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 24px 8px 16px;border-bottom:1px solid var(--line);background:var(--panel);min-height:58px}
.topbar .search{flex:0 1 240px;min-width:140px;margin-left:auto}.topbar>.seg,.topbar>.who,.topbar>.tag,.topbar>.rtog,.topbar>.btn{flex:none;white-space:nowrap}.vcrumb a,.vcrumb .linkb{flex-shrink:4}.vcrumb b{flex-shrink:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accentSoft);color:var(--accent);font-weight:600}
.nsdot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:1.5px solid var(--panel)}
.chdot{position:absolute;bottom:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--dRisk);border:1.5px solid var(--panel)}
.nsdot.inl,.chdot.inl{position:static;display:inline-block;border:0}
.acd{position:relative}
table.accfull td{vertical-align:middle}table.accfull tr.grp td{background:var(--panel2);font-size:14px;padding:8px 10px}
.seats{display:flex;flex-wrap:wrap;gap:4px}.seat{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--offBg);color:var(--off);white-space:nowrap}
.seat.st-Haslogin{background:var(--okBg);color:var(--ok)}.seat.st-Asked{background:var(--warnBg);color:var(--warn)}
.stepper{display:flex;flex-wrap:wrap;gap:4px;grid-column:1/-1}.sp{font-size:12px;padding:4px 8px;border-radius:999px;background:var(--offBg);color:var(--muted)}.sp.past{background:var(--okBg);color:var(--ok)}.sp.cur{background:var(--accent);color:var(--accentInk);font-weight:600}
.seatedit,.thread{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}.seatrow{display:flex;align-items:center;gap:8px}.seatrow b{flex:1}
.thread textarea{width:100%;border:1px solid var(--line2);border-radius:6px;padding:8px;background:var(--panel)}
.sysn{font-size:12px;color:var(--muted);padding-left:10px;border-left:2px solid var(--line2)}
.box.wide{max-width:640px;width:100%}.box textarea{width:100%;border:1px solid var(--line2);border-radius:6px;padding:10px;background:var(--panel2);font:13px/1.5 var(--f-ui);margin-bottom:10px}
.lockt,.readyt{display:block;font-size:12px;margin-top:2px}.lockt{color:var(--bad)}.readyt{color:var(--ok)}
#aform input,#aform select{border:1px solid var(--line2);border-radius:6px;padding:4px 6px;background:var(--panel)}#aform .card{margin-bottom:12px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 14px}
.toolbar .tl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.toolbar select{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 6px;color:var(--ink)}
.fold{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;width:24px;height:24px;padding:0}
.gl{font-size:15px}.flat{display:flex;flex-direction:column}
.kb{grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);padding-bottom:6px}
.kcol{background:var(--panel2);padding:10px;gap:8px;min-width:0}
.kcol.kbad{background:color-mix(in srgb,var(--badBg) 55%,var(--panel2))}
.kh{display:flex;align-items:center;gap:6px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 10px;display:flex;flex-direction:column;gap:5px}
.kcard .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.kcard.blocked,.kcard.late{border-left:3px solid color-mix(in srgb,var(--bad) 60%,transparent)}.kcard.soon{border-left:3px solid var(--dRisk)}
.hint2{color:var(--muted);font-size:13px;margin:-6px 0 10px}
.minesum{font-size:14px;color:var(--muted);margin:-4px 0 12px;line-height:1.5}.minesum b{color:var(--ink);font-weight:600}.minesum .bad{color:var(--bad);font-weight:600}.mineb .ksub{display:flex;gap:6px;flex-wrap:wrap;margin-top:-2px}.mineb .kh .bprog{margin-left:auto}.mineb .kcol.held{opacity:.7}.kcard .meta .role{color:var(--accent);font-weight:600}
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.pcol{padding:12px 12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.pcol:last-child{border-right:0}.pcol.held{background:var(--panel2)}
.ph{align-items:baseline;gap:7px;padding-bottom:8px;margin-bottom:4px;border-bottom:2px solid var(--accentSoft)}
.ph b{font-size:20px;font-weight:700;letter-spacing:-.02em}.ph span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);text-decoration:none;padding:2px 0;min-height:24px}
.pb:hover span{text-decoration:underline}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.who select{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 6px}
main{overflow-y:auto;padding:24px 28px 80px;flex:1;min-width:0;min-height:0}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px;font-weight:700;text-wrap:balance}
h2{font-size:16px;margin:26px 0 10px;font-weight:600}
.sub{color:var(--muted);margin:0 0 18px;max-width:72ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accentInk);font-weight:600}
.btn.quiet{background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.missing{border:1px dashed var(--line2);background:transparent;color:var(--muted);border-radius:6px;padding:2px 8px;font-size:13px;cursor:pointer}
.missing:hover{color:var(--accent);border-color:var(--accent)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0 6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em}
.tile span{color:var(--muted);font-size:13px}
.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--warn)}
/* sow plan strip */
.plan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.week{padding:10px 12px;border-right:1px solid var(--line);min-width:0}
.week:last-child{border-right:0}
.week h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
.week h3 b{color:var(--ink)}
.week .chip{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0;color:var(--ink);text-decoration:none;flex-wrap:wrap}
.week .chip:hover span.nm{text-decoration:underline}
/* tables */
main.themed{background:linear-gradient(180deg,var(--btint) 0,color-mix(in srgb,var(--btint) 55%,var(--bg)) 300px,var(--bg) 700px);background-attachment:local}
main.themed .bhead h1{color:var(--bink);font-size:32px;letter-spacing:.01em}
main.themed .secs{background:color-mix(in srgb,color-mix(in srgb,var(--btint) 42%,var(--bg)) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* ---------- roll-ups (from the Excel formulas) ---------- */

   <div class="fvgrid"><div class="fvbox"><h2>What we need from you</h2>${m.need.length?`<ul>${m.need.map(p=>`<li>Access to ${esc(p)}</li>`).join("")}</ul>`:`<p>Nothing right now. Thank you.</p>`}</div>

    <div class="fvbox"><h2>Coming up next</h2><p>${m.cur+1<n?esc(m.stages[m.cur+1].name):"Growth delivery with your pod"}</p></div></div></div>`}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"><style>body{margin:0;background:var(--c-faf8f4);padding:24px}${FV_CSS}.fv{margin:0 auto}</style></head><body>${founderHtml(m)}<p style="text-align:center;color:#8A8A8A;font:12px system-ui,sans-serif;padding:16px 0 24px">Prepared by Valerie on ${esc(fmtD(m.date,true))}</p></body></html>`}

/* ---------- platform access: 5 steps, who has a login, next step, chasing, one thread per row ----------
   Teams, leads, chase days, BP section map and founder instructions live in config/access_setup. */
const ACC_DONE=["Granted","Team confirmed"],ACC_FOUNDER=["Needed","Asked founder","Founder actioned"],ACC_STEPS=["Needed","Asked founder","Founder actioned","Granted","Team confirmed"];
const SEAT_STATES=["Has login","Asked","Waiting"];
const accGranted=a=>!!a&&ACC_DONE.includes(a.status);
const accOpen=a=>!!a&&a.status!=="Not Needed"&&!accGranted(a);
const ACCESS_SETUP=()=>S.config.access_setup||{};
const accTeams=()=>(ACCESS_SETUP().teams||[]).map(t=>t.name).concat(["Other"]);
function accTeamOf(a){if(a.team)return a.team;for(const t of(ACCESS_SETUP().teams||[]))if((t.platforms||[]).includes(a.platform))return t.name;return"Other"}
function teamLead(n){const t=(ACCESS_SETUP().teams||[]).find(x=>x.name===n);return t&&t.lead||""}
const chaseDays=()=>+ACCESS_SETUP().chase_days||2;
function workdaysSince(iso){const d=parseD(iso);if(!d)return null;let n=0;const x=new Date(d);const t=today();while(x<t){x.setDate(x.getDate()+1);const w=x.getDay();if(w&&w!==6)n++}return n}
function lastContact(a){const c=(a.chases||[]);return c.length?c[c.length-1].date:(a.requested_date||"")}
function needsChase(a){if(a.status!=="Asked founder")return false;const w=workdaysSince(lastContact(a));return w===null||w>=chaseDays()}
const accThread=id=>withId(S.comments).filter(c=>c.access===id).sort((a,b)=>a.at-b.at);
function accSystemNote(a,id,text){if(!db||!canWrite)return;create("comments",null,{brand:a.brand,access:id,kind:"system",text,by:me||"",at:Date.now(),mentions:[]},"Access note")}
function setAccStatus(id,v){const a=S.access[id];if(!a||a.status===v)return;const p={status:v};if(v==="Asked founder"&&!a.requested_date)p.requested_date=isoToday();
  save("access",id,p,bname(a.brand)+" "+a.platform);accSystemNote(a,id,`Status changed from ${a.status||"Needed"} to ${v}`)}

/* BP sections wait for the platforms they audit */
function bpAccess(bid,sec){const need=(ACCESS_SETUP().bp_map||{})[sec]||[];if(!need.length)return null;
  const rows=Object.values(S.access).filter(a=>a.brand===bid&&need.includes(a.platform)&&a.status!=="Not Needed");
  if(!rows.length)return{state:"untracked",need};const missing=rows.filter(a=>!accGranted(a)).map(a=>a.platform);
  return missing.length?{state:"locked",missing}:{state:"ready"}}
const LOCK=`<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path fill="currentColor" d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2h.5A1 1 0 0 1 13 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm1.5 0h4V5a2 2 0 0 0-4 0z"/></svg>`;

/* message to the founder: every missing platform for one brand, with set-up steps */
function founderMessage(bid){const b=S.brands[bid]||{};const rows=withId(S.access).filter(a=>a.brand===bid&&ACC_FOUNDER.includes(a.status));const help=ACCESS_SETUP().help||{};
  if(!rows.length)return"";return`Hi ${b.founder||"there"},\n\nTo start our audit for ${b.name||"the brand"} we still need access to ${rows.length===1?"one platform":rows.length+" platforms"}:\n\n`+
  rows.map((a,i)=>`${i+1}. ${a.platform}${a.access_level&&a.access_level!=="TBC"?` (${a.access_level})`:""}\n   ${help[a.platform]||"Please add our team email with admin access."}`).join("\n\n")+`\n\nLet us know once done and we will confirm we can log in. Thank you!`}
function openFounderMessage(bid){const txt=founderMessage(bid);if(!txt){toast("Nothing is waiting on the founder for this brand.");return}
  const m=$("#modal");const asked=withId(S.access).filter(a=>a.brand===bid&&a.status==="Needed").length;
  m.innerHTML=`<div class="box wide"><h3>Message for ${esc((S.brands[bid]||{}).founder||"the founder")}</h3><p class="muted" style="margin-top:0">One message for every platform still missing at ${esc(bname(bid))}. Copy it into WhatsApp or email. Edit the steps per platform in Settings > Access setup.</p>
   <label for="fm-text" class="sr">Message</label><textarea id="fm-text" rows="12" readonly>${esc(txt)}</textarea>
   <div class="row"><button class="btn pri" data-act="fm-copy">Copy message</button>${asked&&canWrite?`<button class="btn" data-act="fm-asked" data-id="${esc(bid)}">Copy and mark ${asked} as Asked founder</button>`:""}<span class="grow"></span><button class="btn" data-act="mclose">Close</button></div></div>`;m.hidden=false}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("Copied")}catch(e){const x=$("#fm-text");if(x){x.focus();x.select()}toast("Press Ctrl+C or Cmd+C to copy")}}

/* views */
const ACC_MARK={"Needed":"✗","Asked founder":"A","Founder actioned":"F","Granted":"✓","Team confirmed":"✓✓","Blocked":"!","Not Needed":"–"};
let accQueue="open";
function accQueues(){const q=[["open","All open"],["founder","Waiting on founder"],["chase","Needs a chase"]];for(const t of accTeams())q.push(["team:"+t,t]);q.push(["logins","Team logins missing"],["done","Done"]);return q}
function inQueue(a,q){if(q==="open")return accOpen(a)||a.status==="Granted";if(q==="founder")return ACC_FOUNDER.includes(a.status);if(q==="chase")return needsChase(a);
  if(q==="logins")return a.status==="Granted";if(q==="done")return a.status==="Team confirmed"||a.status==="Not Needed";if(q.startsWith("team:"))return accTeamOf(a)===q.slice(5)&&a.status!=="Not Needed";return true}
function seatChips(a){const s=a.seats||[];if(!s.length)return`<span class="faint">No one yet</span>`;return s.map(x=>`<span class="seat st-${key(x.s)}" title="${esc(x.p+": "+x.s)}">${esc(x.p)}${x.s==="Has login"?" ✓":x.s==="Asked"?" ·":""}</span>`).join("")}
function accBrands(){const all=withId(S.access);const by={};for(const a of all)if(inQueue(a,accQueue))(by[a.brand]=by[a.brand]||[]).push(a);
  return Object.keys(by).filter(b=>S.brands[b]).sort((x,y)=>(holdOf(x)?1:0)-(holdOf(y)?1:0)||(by[y].some(needsChase)?1:0)-(by[x].some(needsChase)?1:0)||bname(x).localeCompare(bname(y))).map(b=>{const mine=all.filter(a=>a.brand===b&&a.status!=="Not Needed");
    return{b,n:by[b].length,ok:mine.filter(accGranted).length,total:mine.length,chase:by[b].filter(needsChase).length,founder:by[b].filter(a=>ACC_FOUNDER.includes(a.status)).length}})}
function accFull(bid){
  if(!bid){const list=accBrands();const chips=`<div class="toolbar accbar"><label class="tl">Show <select data-act="accqsel" aria-label="Which platforms">${accQueues().map(([k,l])=>{const n=withId(S.access).filter(a=>S.brands[a.brand]&&!holdOf(a.brand)&&inQueue(a,k)).length;return`<option value="${esc(k)}" ${accQueue===k?"selected":""}>${esc(l)} (${n})</option>`}).join("")}</select></label></div>`;
    if(!list.length)return chips+`<div class="tw"><div class="empty">Nothing in this list.</div></div>`;
    const cur=list.some(x=>x.b===accBrand)?accBrand:list[0].b;
    const side=`<div class="acclist" role="list" aria-label="Brands"><input id="acc-find" type="search" placeholder="Find a brand (${list.length})" aria-label="Find a brand"><div class="accbs">${list.map(x=>`<button role="listitem" class="accb ${x.b===cur?"on":""}" data-act="accb" data-id="${esc(x.b)}" data-n="${esc(bname(x.b).toLowerCase())}" aria-current="${x.b===cur}"><span class="an">${esc(bname(x.b))}</span><span class="am">${x.ok} of ${x.total} granted</span><span class="aw ${x.chase?"bad":x.founder?"warn":x.ok===x.total&&x.total?"ok":"off"}">${x.chase?`${smark("blk","")} ${x.chase} to chase`:x.founder?`${x.founder} with founder`:x.ok===x.total&&x.total?`${smark("done","")} All granted`:"Open"}</span></button>`).join("")}</div></div>`;
    const br=S.brands[cur]||{};const waiting=withId(S.access).filter(a=>a.brand===cur&&ACC_FOUNDER.includes(a.status)).length;const total=withId(S.access).filter(a=>a.brand===cur).length;const shown=list.find(x=>x.b===cur).n;
    const top=`<div class="row accbh"><h2><a class="bname" href="#brand-${esc(cur)}">${esc(bname(cur))}</a></h2><span class="faint">${esc(br.founder?"Founder: "+br.founder:"")}</span><span class="grow"></span>${waiting?`<button class="btn sm" data-act="fm-open" data-id="${esc(cur)}">Message for founder (${waiting})</button>`:""}${canWrite?`<button class="btn sm" data-act="add-access" data-id="${esc(cur)}">Add platform</button>`:""}</div>${shown<total?`<p class="faint" style="margin:0 0 8px">Showing ${shown} of ${total} platforms in this list.</p>`:""}`;
    return chips+`<div class="accmd">${side}<div class="accdet">${top}${accRows(withId(S.access).filter(a=>a.brand===cur&&inQueue(a,accQueue)),cur)}</div></div>`}
  return accRows(withId(S.access).filter(a=>a.brand===bid),bid)}
function accRows(rows,bid){
  const ord=a=>ACC_STEPS.indexOf(a.status)<0?(a.status==="Blocked"?-1:9):ACC_STEPS.indexOf(a.status);
  let h="";
  if(!rows.length)return`<div class="tw"><div class="empty">No platforms tracked for ${esc(bname(bid))} yet. Add the ones the team needs.</div></div>`;
  h+=`<div class="tw"><table class="accfull"><thead><tr><th>Platform</th><th>Status and type</th><th>Team logins</th><th>Next step</th><th class="num"><span class="sr">Comments</span></th></tr></thead><tbody>`;
  {const list=rows.sort((x,y)=>ord(x)-ord(y)||String(x.platform).localeCompare(y.platform));
    for(const a of list){const lc=lastContact(a);const wd=workdaysSince(lc);const th=accThread(a._id).filter(c=>c.kind!=="system").length;const ns=a.next_step||{};
      h+=`<tr class="click" data-act="open" data-kind="access" data-id="${esc(a._id)}"><td class="ap"><b>${esc(a.platform)}</b><div class="sub2">${esc(accTeamOf(a))}${a.needed_for&&a.needed_for.toLowerCase()!==accTeamOf(a).toLowerCase()?" · "+esc(a.needed_for):""}</div></td>
       <td class="as">${statusSel("access",a._id,a.status||"Needed",L("access_status"),canWrite)}<div class="sub2">${esc(a.access_level&&a.access_level!=="TBC"?a.access_level:"Type TBC")}${a.access_via?" · "+esc(a.access_via):""}</div>${a.status==="Blocked"&&a.blocker?`<div class="blk">${esc(a.blocker)}</div>`:""}</td>
       <td><div class="seats">${seatChips(a)}</div></td>
       <td class="an2">${ns.text?`${esc(ns.text)}<div class="sub2">${esc(ns.who||"No one")}${ns.due?" · by "+esc(fmtD(ns.due)):""}</div>`:accOpen(a)?`<span class="tag warn">No next step</span>`:""}${lc&&ACC_FOUNDER.includes(a.status)?`<div class="sub2 ${needsChase(a)?"hot":""}">Last asked ${esc(fmtD(lc))}${wd!==null?` · ${wd} working day${wd===1?"":"s"}`:""}</div>`:""}</td>
       <td class="num">${th?`<span class="cnt" title="${th} comment${th===1?"":"s"}">${th}</span>`:""}</td></tr>`}}
  return h+`</tbody></table></div>`}
function accDrawer(id){const a=S.access[id];const th=accThread(id);const team=accTeamOf(a);const ns=a.next_step||{};const st=a.status||"Needed";
  const steps=`<div class="stepper w">${ACC_STEPS.map((x,i)=>`<span class="sp ${x===st?"cur":ACC_STEPS.indexOf(st)>i?"past":""}">${i+1}. ${esc(x)}</span>`).join("")}${["Blocked","Not Needed"].includes(st)?`<span class="sp cur">${esc(st)}</span>`:""}</div>`;
  const teamPeople=activePeople();
  return steps+"<!--platform-->"+field("Status",sel("status",L("access_status"),st,false))+field("Team",sel("team",accTeams(),team,false),0,team==="Other"?"":"Lead: "+(teamLead(team)||"not set"))
   +field("Access type",sel("access_level",L("access_level"),a.access_level))+field("How it is given",sel("access_via",L("access_via"),a.access_via),0,"Never store passwords here")
   +field("Needed for",inp("needed_for",a.needed_for),1)+field("Valerie owner",sel("owner",activePeople(),a.owner))+field("Brand contact",inp("brand_contact",a.brand_contact))
   +field("Asked founder on",inp("requested_date",a.requested_date,"date"))+field("Deadline",inp("deadline",a.deadline,"date"))
   +`<h4 class="dh">Next step</h4>`+field("What happens next",inp("ns_text",ns.text),1,"One line, for example: Noopur to ask Zach to add our email in GA4")+field("Who",sel("ns_who",activePeople(),ns.who))+field("By",inp("ns_due",ns.due,"date"))
   +field("Blocker",inp("blocker",a.blocker),1)+field("Notes",area("notes",a.notes),1,"Status only. No passwords or login details.")
   +`<h4 class="dh">Team logins</h4><div class="w seatedit">${(a.seats||[]).map((x,i)=>`<div class="seatrow"><b>${esc(x.p)}</b><select data-act="seat" data-i="${i}" aria-label="${esc(x.p)} login">${opts(SEAT_STATES,x.s,false)}</select><button type="button" class="btn sm quiet" data-act="seat-del" data-i="${i}" aria-label="Remove ${esc(x.p)}">Remove</button></div>`).join("")||`<p class="faint" style="margin:0">No one added yet.</p>`}
     ${canWrite?`<div class="row" style="gap:6px;margin-top:6px"><select id="seat-p" aria-label="Person">${opts(teamPeople.filter(p=>!(a.seats||[]).some(x=>x.p===p)),"")}</select><button type="button" class="btn sm" data-act="seat-add">Add person</button></div>`:""}</div>`
   +(ACC_FOUNDER.includes(st)?`<h4 class="dh">Chasing the founder</h4><div class="w">${(a.chases||[]).slice(-5).map(c=>`<div class="faint" style="font-size:12.5px">${esc(fmtD(c.date,true))} · ${esc(c.by||"")} · ${esc(c.how||"")}${c.note?": "+esc(c.note):""}</div>`).join("")||`<p class="faint" style="margin:0">Not chased yet.</p>`}
     ${canWrite?`<div class="row" style="gap:6px;margin-top:6px"><select id="ch-how" aria-label="How">${opts(["WhatsApp","Email","Call","Slack","In a meeting"],"WhatsApp",false)}</select><input id="ch-note" placeholder="Optional note" aria-label="Chase note" style="flex:1;min-width:120px"><button type="button" class="btn sm" data-act="chase">Log a chase</button></div>`:""}
     <button type="button" class="btn sm" style="margin-top:8px" data-act="fm-open" data-id="${esc(a.brand)}">Message for founder</button></div>`:"")
   +`<h4 class="dh">Notes and comments</h4><div class="w thread">${th.map(c=>c.kind==="system"?`<div class="sysn">${esc(new Date(c.at).toLocaleDateString("en-GB",{day:"numeric",month:"short"}))} · ${esc(c.by||"")} · ${esc(c.text)}</div>`:`<div class="cmt"><div class="row" style="gap:8px"><b>${esc(c.by||"Someone")}</b><span class="faint" style="font-size:12px" title="${esc(agoText(c.at))}">${esc(fmtD(new Date(c.at).toISOString().slice(0,10)))}, ${esc(new Date(c.at).toLocaleTimeString("en-GB",{hour:"numeric",minute:"2-digit",hour12:true}).replace(" ","").toLowerCase())}${c.tz?" "+esc(c.tz):""}</span></div><div class="ctext">${linkMentions(c.text)}</div></div>`).join("")||`<p class="faint" style="margin:0">No comments yet.</p>`}
     ${canWrite?`<label for="acc-c" class="sr">Comment</label><textarea id="acc-c" placeholder="Update or question. @name to tag someone" rows="2"></textarea><button type="button" class="btn sm pri" data-act="acc-post" style="align-self:flex-start">Post</button>`:""}</div>`}

/* ---------- brand sections: one tile per area, each shows its own state ---------- */
function brandTiles(id,r){

const LOG_FIELD={status:"",owner:"owner",due:"due date",deadline:"due date",since:"date",next_step:"next step",gf_link:"GF link",sow_link:"SOW link",stage:"stage",blocker:"blocker",notes:"notes",founder:"founder",founder_country:"founder country",founder_zone:"founder time zone",priority:"priority",ns_log:"next steps log",target_sign:"target sign date",draft_due:"draft due",title:"name",support:"support team",lead:"brand lead",approved_by:"signed off by",approved_at:"signed off on",updated_by:"by"};
function logLine(e,plain){const bn=(S.brands[e.id]||{}).name;let lab=String(e.label||"");
  if(bn&&lab.startsWith(e.id+":"))lab=bn+lab.slice(e.id.length);

  if(code){const st=S.steps[code];const who=bn||lab.replace(/[: ].*$/,"");const f=S.steps[e.field]?"":(e.field in LOG_FIELD?LOG_FIELD[e.field]:e.field);
    return`${esc(who)} · <b>${esc((st.no?st.no+" ":"")+st.name)}</b>${f?" "+esc(f):""}${plain(e.old)&&plain(e.new)?` <span class="logv">${esc(e.old||"(blank)")} → ${esc(e.new||"(blank)")}</span>`:""}`}
  if(/_link$/.test(e.field))return`${esc(lab.replace(/:.*$/,""))} · ${esc(LOG_FIELD[e.field])} ${e.new?"updated":"removed"}`;

function gateBlock(bid,code){const s=S.steps[code];if(!s||!s.is_gate)return"";const open=stepsSorted().filter(x=>x.order<s.order&&!x.is_optional&&!["Done","N/A"].includes(stepState(bid,x.code).status));

async function saveStep(bid,code,next){
  if(!db||!canWrite){toast("You can view this tracker but not change it.");return}
  const had=!!S.bsteps[bid];const doc=S.bsteps[bid]||{brand:bid,s:{}};const cur=(doc.s||{})[code]||{};
  if(S.steps[code]&&S.steps[code].is_gate&&next.status==="Done"&&cur.status!=="Done")next=Object.assign({},next,{approved_by:me||"",approved_at:isoToday()});
  if(next.status&&next.status!=="Done"&&cur.approved_by)next=Object.assign({},next,{approved_by:"",approved_at:""});
  if(cur.sent_back&&!("sent_back" in next))next=Object.assign({},next,{sent_back:null});
  if(next.status&&next.status!==(cur.status||""))next=Object.assign({},next,{since:isoToday()});
  const merged=Object.assign({},cur,next);
  const p={};for(const k of Object.keys(next))if(JSON.stringify(cur[k]??"")!==JSON.stringify(next[k]??""))p[k]=next[k];if(!Object.keys(p).length)return;
  const old={};for(const k of Object.keys(p))old[k]=cur[k];
  S.bsteps[bid]=Object.assign({},doc,{s:Object.assign({},doc.s||{},{[code]:merged})});render();
  return chain("bs/"+bid,()=>had?db.doc("brand_steps/"+bid).update({s:{[code]:merged},updated_at:Date.now()}):db.doc("brand_steps/"+bid).set({brand:bid,s:{[code]:merged},updated_at:Date.now()}))
   .then(()=>{toast("Saved");addLog("bsteps",bid,p,old,bname(bid)+" "+code)}).catch(e=>{if(!refused(e))toast("Not saved. Try again.");S.bsteps[bid]=doc;render()})}

    if(k==="config"&&!me&&U){U.me().then(v=>{if(!me&&v&&v.name){const first=v.name.split(" ")[0].toLowerCase();const hit=activePeople().find(p=>p.toLowerCase()===first);if(hit){me=hit;selfMe=hit;render()}}}).catch(()=>{})}
    scheduleRender()},err=>{if(err&&err.code!=="revoked")toast("Live updates paused. Reload the page.")});
  for(const[k,c]of Object.entries(COLL))sub(k,c);
  db.collection("log").orderBy("date","desc").limit(30).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});S.log=o;if(route.v==="changes")render()},()=>{});
})();
})();

/* popups: name them, keep Tab inside, give focus back when they close; long names that are cut off get a hover tip */
(function(){const back={};let lastOut=null;document.addEventListener("focusin",e=>{const x=e.target;if(!x.closest||x.closest("#modal,#drawer"))return;lastOut=x},true);
 document.addEventListener("pointerdown",e=>{const x=e.target.closest&&e.target.closest("[data-act],button,a[href]");if(x&&!x.closest("#modal,#drawer"))lastOut=x},true);const top=()=>{const m=document.getElementById("modal"),d=document.getElementById("drawer");return m&&!m.hidden?m:d&&!d.hidden?d:null};
 const watch=el=>new MutationObserver(()=>{const id=el.id;if(!el.hidden){if(back[id]===undefined)back[id]=lastOut;
   const h=el.querySelector("h1,h2,h3,.cbtitle");const n=h?(h.value||h.textContent||"").trim():"";if(n)el.setAttribute("aria-label",n.slice(0,80))}
  else if(back[id]!==undefined){const a=back[id];back[id]=undefined;if(!a)return;const k=a.dataset&&a.dataset.id,ac=a.dataset&&a.dataset.act;
   setTimeout(()=>{if(top())return;let f=a.isConnected?a:null;if(!f&&k)f=[...document.querySelectorAll("[data-id]")].find(x=>x.dataset.id===k&&(!ac||x.dataset.act===ac));try{if(f)f.focus()}catch(e){}},60)}}).observe(el,{attributes:true,attributeFilter:["hidden"],childList:true});
 ["modal","drawer"].forEach(id=>{const el=document.getElementById(id);if(el)watch(el)});
 document.addEventListener("keydown",e=>{if(e.key!=="Tab")return;const el=top();if(!el)return;
  const f=[...el.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])')].filter(x=>x.getClientRects().length);if(!f.length)return;
  const a=f[0],z=f[f.length-1];if(!el.contains(document.activeElement)){e.preventDefault();a.focus()}else if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}});
 let q=0;const tip=()=>{q=0;document.querySelectorAll(".bname,.kt,.kname").forEach(x=>{if(x.scrollWidth>x.clientWidth+1){if(!x.title)x.title=x.textContent.trim()}})};
 (window.__afterMain=window.__afterMain||[]).push(tip);
 const mn=document.getElementById("main");if(mn)new MutationObserver(()=>{if(!q)q=requestAnimationFrame(tip)}).observe(mn,{childList:true,subtree:true});addEventListener("resize",()=>{if(!q)q=requestAnimationFrame(tip)});
})();

/* long next steps and blockers: show "Show more" only when the text is cut; clicking the text or the link opens it in full */
(function(){const XO=window.__xpOpen=window.__xpOpen||new Set();const box=x=>x.closest(".nsc");
 const set=(x,o)=>{x.classList.toggle("open",o);x.setAttribute("aria-expanded",o);const b=box(x);const h=b&&b.querySelector(".nshist");if(h)h.hidden=!o;const c=b&&b.querySelector(".nsmorec");if(c)c.textContent=o?"Hide earlier notes":c.dataset.t};
 /* text that is cut off (or has earlier notes behind it) becomes clickable; text that fits is left alone */
 const fit=()=>document.querySelectorAll(".xp").forEach(x=>{const b=box(x);const has=!!(b&&b.querySelector(".nshist"));
   if(x.dataset.xk&&XO.has(x.dataset.xk)){x.classList.add("cut");if(!x.classList.contains("open"))set(x,true);return}
   if(x.classList.contains("open"))return;const cut=has||x.scrollHeight>x.clientHeight+2;x.classList.toggle("cut",cut);if(cut){x.tabIndex=0;x.title=has?"Click to read all, with earlier notes":"Click to read all"}else{x.removeAttribute("tabindex");x.removeAttribute("title")}});
 (window.__afterMain=window.__afterMain||[]).push(fit);
 const mn=document.getElementById("main");let q=0;if(mn)new MutationObserver(()=>{if(!q)q=requestAnimationFrame(()=>{q=0;fit()})}).observe(mn,{childList:true,subtree:true});addEventListener("resize",fit);
 const tog=el=>{const x=el.classList.contains("xp")?el:box(el)&&box(el).querySelector(".xp");if(!x||!(x.classList.contains("cut")||x.classList.contains("open")))return;const o=!x.classList.contains("open");set(x,o);if(x.dataset.xk){if(o)XO.add(x.dataset.xk);else XO.delete(x.dataset.xk)}};
 document.addEventListener("click",e=>{const el=e.target.closest("[data-act=xp]");if(el){e.preventDefault();e.stopPropagation();tog(el)}},true);
 document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".xp")){e.preventDefault();tog(e.target)}});})();

/* timeline: a month name that would run under the Today marker is hidden */
(function(){const fix=()=>document.querySelectorAll(".rmt").forEach(r=>{const td=r.querySelector(".rmtl");r.querySelectorAll(".rmm").forEach(m=>{m.style.visibility="";if(!td||!td.offsetParent)return;const a=td.getBoundingClientRect(),b=m.getBoundingClientRect();if(b.right>a.left-4&&b.left<a.right+4)m.style.visibility="hidden"})});
 (window.__afterMain=window.__afterMain||[]).push(fix);
 const mn=document.getElementById("main");let q=0;if(mn)new MutationObserver(()=>{if(!q)q=requestAnimationFrame(()=>{q=0;fix()})}).observe(mn,{childList:true,subtree:true});addEventListener("resize",fix)})();
</script>
